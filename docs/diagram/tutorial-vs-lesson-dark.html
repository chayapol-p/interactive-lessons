<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tutorial-vs-lesson-dark-title tutorial-vs-lesson-dark-desc"><title id="tutorial-vs-lesson-dark-title">A tutorial against a lesson</title><desc id="tutorial-vs-lesson-dark-desc">Left, a tutorial: lines of text you read, nod at and forget. Right, a lesson: in the Monty Hall game the learner says door 2's chance is 1 in 2, and sees why it is really 2 in 3.</desc><defs><pattern id="tutorial-vs-lesson-dark-rules" width="960" height="30" patternUnits="userSpaceOnUse"><path d="M0 29.5 H960" stroke="#2c3a4a" stroke-width="1"/></pattern></defs><rect width="960" height="470" fill="#1b2430"/><rect width="960" height="470" fill="url(#tutorial-vs-lesson-dark-rules)"/><path d="M44 0 V470" stroke="#7a3b3b" stroke-width="2"/><text x="80" y="96" fill="#9fb0be" font-size="22" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">A tutorial</text><rect x="80" y="128" width="300" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="158" width="330" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="188" width="280" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="218" width="320" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="248" width="260" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="278" width="310" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="308" width="290" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><rect x="80" y="338" width="200" height="9" rx="4.5" fill="#9fb0be" opacity="0.32"/><text x="230" y="420" fill="#9fb0be" font-size="28" font-weight="700" font-family="'Caveat', cursive" text-anchor="middle">read · nod · forget</text><path d="M 436,240 L 520,240" fill="none" stroke="#eef1ea" stroke-width="2"/><path d="M520,240 l-10,-6 v12 z" fill="#eef1ea"/><text x="560" y="96" fill="#8fb8ff" font-size="22" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">A lesson</text><text x="560" y="136" fill="#eef1ea" font-size="19" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">After the host opens door 3,</text><text x="560" y="162" fill="#eef1ea" font-size="19" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">door 2's chance of hiding the car is</text><rect x="560" y="176" width="112" height="40" rx="4" fill="#232e3b" stroke="#ff8f7a" stroke-width="2.5"/><text x="576" y="203" fill="#ff8f7a" font-size="19" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">1 in 2  ✗</text><path d="M684,200 q17.0,-16 34,-4" fill="none" stroke="#ff8f7a" stroke-width="2.5" stroke-linecap="round"/><text x="726" y="200" fill="#ff8f7a" font-size="27" font-weight="700" font-family="'Caveat', cursive" text-anchor="start">see why ↓</text><rect x="560" y="234" width="340" height="112" rx="8" fill="#232e3b" stroke="#9fb0be" stroke-width="1.4"/><text x="580" y="264" fill="#9fb0be" font-size="16" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">What this choice leads to</text><text x="580" y="292" fill="#eef1ea" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">1 in 2 would mean your door's chance</text><text x="580" y="314" fill="#eef1ea" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">grew from 1 in 3, but the host never</text><text x="580" y="336" fill="#eef1ea" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">touches your door. Door 2 holds 2 in 3.</text><text x="730" y="420" fill="#8fb8ff" font-size="28" font-weight="700" font-family="'Caveat', cursive" text-anchor="middle">guess · pick · see why</text><circle cx="890" cy="62" r
