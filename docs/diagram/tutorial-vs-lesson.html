ted Grotesk', system-ui, sans-serif" text-anchor="start">A lesson</text><text x="560" y="136" fill="#22262b" font-size="19" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">After the host opens door 3,</text><text x="560" y="162" fill="#22262b" font-size="19" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">door 2's chance of hiding the car is</text><rect x="560" y="176" width="112" height="40" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="576" y="203" fill="#c0392b" font-size="19" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">1 in 2  ✗</text><path d="M684,200 q17.0,-16 34,-4" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/><text x="726" y="200" fill="#c0392b" font-size="27" font-weight="700" font-family="'Caveat', cursive" text-anchor="start">see why ↓</text><rect x="560" y="234" width="340" height="112" rx="8" fill="#ffffff" stroke="#6b6f74" stroke-width="2.2"/><text x="580" y="264" fill="#6b6f74" font-size="16" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">What this choice leads to</text><text x="580" y="292" fill="#22262b" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">1 in 2 would mean your door's chance</text><text x="580" y="314" fill="#22262b" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">grew from 1 in 3, but the host never</text><text x="580" y="336" fill="#22262b" font-size="17" font-weight="400" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">touches your door. Door 2 holds 2 in 3.</text><rect x="560" y="364" width="112" height="40" rx="6" fill="#ffffff" stroke="#1d5ca8" stroke-width="4"/><text x="576" y="391" fill="#1d5ca8" font-size="19" font-weight="700" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="start">2 in 3</text><path d="M636,380 l12.2,13.9 l26.1,-36.5" fill="none" stroke="#c0392b" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="462" fill="#1d5ca8" font-size="28" font-weight="700" font-family="'Caveat', cursive" text-anchor="middle">guess · pick · see why</text><circle cx="890" cy="62" r="36" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="890" y="58" fill="#c0392b" font-size="20" font-weight="700" font-family="'Caveat', cursive" text-anchor="middle">Lesson</text><text x="890" y="82" fill="#c0392b" font-size="24" font-weight="700" font-family="'Caveat', cursive" text-anchor="middle">1</text></svg>
