<title>__LESSON_TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?__FONT_QUERY__&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Lesson page template for building-interactive-lessons.
   scripts/build_page.py fills it from the blueprint. Never edit a built page by hand: edit the blueprint and rebuild.
   Layout: one narrow reading column (phone first), a slim sticky bar, plain sections; only interactive panels get a surface. */
/* Colour tokens: scripts/theme.py writes them from the blueprint's theme (one accent colour), light and dark.
   Brand layer (the theme may change it): bg, surface, surface-2, code-bg, ink, muted, line, line-strong, dim,
   accent, accent-soft, on-accent, ramp-0..5 with ramp-text-0..5. Meaning layer (fixed in every lesson):
   good and bad (right and wrong), mark (answer shown), each with a soft fill. */
/*__THEME_TOKENS__*/
:root {
  --shadow: 0 1px 2px rgb(15 20 30 / 0.10), 0 6px 18px rgb(15 20 30 / 0.10);
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.44rem;
  --step-3: 2rem;
  --step-4: 2.5rem;
  --radius: 10px;
  --tap: 44px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 96px; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--step-0); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.column { max-width: 42rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.topbar-row { max-width: 42rem; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.topbar-title { flex: 1; min-width: 0; font-weight: 700; font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none; }
.topbar-where { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress-track { max-width: 42rem; margin: 8px auto 0; height: 3px; background: var(--line); }
.progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.mode-line { max-width: 42rem; margin: 6px auto 0; font-size: var(--step--1); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode-line .on { color: var(--mark); font-weight: 600; }
.where-short { display: none; }
@media (max-width: 460px) { .where-long { display: none; } .where-short { display: inline; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 0.9375rem; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding: 0 8px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Chapter header */
.eyebrow { font-size: var(--step--1); color: var(--muted); font-weight: 600; }
.chapter-head { display: flex; flex-direction: column; gap: 10px; padding-top: 24px; }
.chapter-head h1 { font-size: var(--step-3); font-weight: 700; letter-spacing: -0.015em; }
.bridge { font-family: var(--font-read); color: var(--muted); font-style: italic; font-size: var(--step-1); }
.why { font-size: 0.9375rem; color: var(--muted); }

/* Blocks */
.block { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 80px; min-width: 0; }
.block-label { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 0.875rem; font-weight: 600; color: var(--muted); }
.block-label .tag { font-weight: 400; }
.block-label .spacer { flex: 1; }
.question { font-family: var(--font-read); font-size: var(--step-1); line-height: 1.45; }
.reading { font-family: var(--font-read); font-size: var(--step-1); line-height: 1.6; }
details.more { border-left: 2px solid var(--line); padding-left: 12px; }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 500; min-height: var(--tap); display: flex; align-items: center; }
details.more p { margin-top: 8px; color: var(--muted); }
.badge { display: inline-block; font-size: 0.8125rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--mark-soft); color: var(--mark); }
.badge.ok { background: var(--good-soft); color: var(--good); }
.term { display: inline; font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 1.5px dotted var(--accent); cursor: help; }

/* Options (predict and check) */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option { text-align: left; min-height: var(--tap); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; line-height: 1.4; }
.option:hover:not(:disabled) { border-color: var(--accent); }
.option:disabled { cursor: default; }
.option.right { border-color: var(--good); background: var(--good-soft); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.right::before { content: "✓  "; color: var(--good); font-weight: 700; }
.option.wrong::before { content: "✗  "; color: var(--bad); font-weight: 700; }
.confidence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--muted); }
.confidence button { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 0.875rem; min-height: var(--tap); }
.confidence button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.feedback { border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9375rem; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback.neutral { background: var(--surface-2); }
.feedback strong { font-weight: 700; }

/* Code */
.code-panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.code-panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: var(--step--1); color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.code-panel-head .file { font-family: var(--font-code); color: var(--ink); overflow-wrap: anywhere; }
textarea.code, pre.code { display: block; width: 100%; margin: 0; border: 0; background: var(--code-bg); color: var(--ink); font-family: var(--font-code); font-size: 0.8125rem; line-height: 1.55; padding: 12px; tab-size: 4; white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.code { min-height: 8em; resize: vertical; }
.output { border-top: 1px solid var(--line); }
.output-label { padding: 8px 12px 0; font-size: 0.875rem; color: var(--muted); font-weight: 600; }
.output pre { margin: 0; padding: 6px 12px 8px; font-family: var(--font-code); font-size: 0.8125rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.origin-line { padding: 0 12px 10px; font-size: 0.75rem; color: var(--muted); font-family: var(--font-code); }
.origin-line::before { content: "● "; color: var(--good); }
.output.error pre { color: var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; }
.plain-error { padding: 8px 12px 0; font-size: 0.875rem; color: var(--bad); }
.code-actions { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.notice { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 0.9375rem; }
.local-run { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-size: 0.875rem; display: flex; flex-direction: column; gap: 6px; }
.local-run code { font-family: var(--font-code); font-size: 0.78rem; overflow-wrap: anywhere; }
.context-note { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-size: 0.875rem; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.context-note ul { margin: 0; padding-left: 18px; }
.run-note { padding: 0 12px 10px; font-size: 0.8125rem; color: var(--muted); }
.result-text { padding: 6px 12px 8px; font-family: var(--font-read); font-size: 1rem; line-height: 1.5; }
.blank-text { padding: 14px 12px; font-family: var(--font-read); font-size: var(--step-1); line-height: 2.1; }
.blank-text .blank { font-family: var(--font-ui); font-size: 0.9375rem; }
.scroll-x { overflow-x: auto; min-width: 0; }

/* Compare */
.switch { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; overflow-x: auto; }
.switch button { flex: 1; min-width: max-content; min-height: 40px; border: 0; background: transparent; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; }
.switch button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.compare-input { font-size: 0.875rem; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(step); font-family: var(--font-code); font-size: 0.8125rem; color: var(--muted); padding-top: 2px; }
.steps li.differs { background: var(--mark-soft); margin-inline: -8px; padding-inline: 8px; border-radius: 6px; border-bottom-color: transparent; }
.steps li.differs::before { color: var(--mark); font-weight: 600; }
.differs-flag { font-size: 0.75rem; font-weight: 700; color: var(--mark); text-transform: uppercase; letter-spacing: .05em; }

/* Exercises */
.exercise { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.exercise .code-panel { border: 0; border-radius: 8px; background: var(--code-bg); }
.exercise .code-panel-head, .exercise .code-actions, .exercise .chooser, .exercise .output { border-color: var(--line); background: transparent; }
.exercise .blank-text { background: transparent; }
.exercise ul.instructions, .stretch-body ul.instructions { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
textarea.answer { width: 100%; min-height: 7em; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); padding: 10px; font-family: var(--font-read); font-size: 1rem; line-height: 1.5; resize: vertical; }
.criteria { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.9375rem; }
.criteria li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.self-check { display: flex; flex-direction: column; gap: 6px; }
.self-check label { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; }
.solution-label { font-size: 0.875rem; font-weight: 600; color: var(--mark); }
.help-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.help-row .btn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--muted); }
.solution-panel { border: 1px solid var(--mark); border-radius: var(--radius); background: var(--mark-soft); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.solution-panel pre.code { border-radius: 8px; }
.solution-panel .reading { font-size: var(--step-0); }
.solution-note { font-size: 0.875rem; color: var(--muted); }
.read-along { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: var(--step--1); font-weight: 500; white-space: nowrap; }
@media (max-width: 420px) { .topbar-where { display: none; } }  /* on a phone the chapter heading shows where you are; the title gets the room */
.read-along .knob { width: 26px; height: 16px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background .2s; }
.read-along .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.read-along[aria-pressed="true"] { border-color: var(--mark); color: var(--mark); }
.read-along[aria-pressed="true"] .knob { background: var(--mark); }
.read-along[aria-pressed="true"] .knob::after { transform: translateX(10px); }
pre.blank-code { line-height: 2.5; }
.blank { position: relative; font: inherit; font-size: 0.8125rem; line-height: 1.4; min-height: 32px; padding: 4px 10px; margin: 0 1px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; vertical-align: baseline; }
.blank.empty { border-style: dashed; color: var(--accent); font-family: var(--font-ui); font-weight: 600; }
.blank.active { outline: 2px solid var(--accent); outline-offset: 1px; }
.blank.wrong { border-color: var(--bad); background: var(--bad-soft); }
.blank.right { border-color: var(--good); background: var(--good-soft); }
.blank::before { content: ""; position: absolute; inset: -6px -2px; }
.blank.right::after { content: " ✓"; color: var(--good); font-weight: 700; }
.blank.wrong::after { content: " ✗"; color: var(--bad); font-weight: 700; }
.chooser { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.chooser-label { font-size: 0.875rem; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-direction: column; gap: 8px; }
.chip { text-align: left; min-height: var(--tap); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--code-bg); color: var(--ink); font-family: var(--font-code); font-size: 0.8125rem; line-height: 1.4; cursor: pointer; overflow-wrap: anywhere; }
.chip:hover { border-color: var(--accent); }
.chips.text .chip { font-family: var(--font-ui); font-size: 0.9375rem; background: var(--surface); }  /* words, not code */
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
details.stretch { border: 1px dashed var(--line); border-radius: var(--radius); padding: 0 14px; background: var(--surface); }
details.stretch[open] { padding-bottom: 14px; }
details.stretch summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
.stretch-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side-by-side { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .side-by-side { grid-template-columns: 1fr 1fr; } }

/* Pitfall */
.pitfall { border-left: 3px solid var(--bad); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 8px; }
.pitfall p { margin: 0; }
.pitfall .wrong-idea { font-family: var(--font-read); font-size: var(--step-1); }
.pitfall .lead { font-weight: 600; }
.pitfall .source { font-size: 0.8125rem; color: var(--muted); }

/* Recap */
.recap { border-top: 2px solid var(--ink); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.recap .line { font-family: var(--font-read); font-size: var(--step-1); font-weight: 600; }

/* Diagrams. Classes an authored `kind: svg` figure can use: svg-box (hot, dim, ghost), svg-text (small, dim, hot),
   svg-line (hot, dim), svg-arrowhead (hot, dim), svg-bar (low), svg-grid, svg-overlap, svg-group (dim). */
.figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.figure-box { overflow-x: auto; padding: 4px 0; }
.figure svg { display: block; width: 100%; height: auto; min-width: 300px; }
.figure figcaption { font-size: 0.9375rem; color: var(--muted); font-family: var(--font-read); }
.frame-caption { margin: 6px 0 0; font-size: 0.9375rem; font-weight: 600; }
.figure figcaption .toy { font-family: var(--font-ui); font-weight: 600; }
.svg-box { fill: var(--surface); stroke: var(--line-strong); }
.svg-box.hot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.svg-box.dim { fill: var(--bg); stroke: var(--line); }
.svg-box.ghost { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
.svg-text { fill: var(--ink); font-family: var(--font-ui); font-size: 12px; }
.svg-text.small { font-size: 10px; fill: var(--muted); }
.svg-text.dim { fill: var(--muted); }
.svg-text.small.hot { fill: var(--accent); font-weight: 600; }
.svg-line { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.svg-label-mask { fill: var(--bg); }
.svg-line.hot { stroke: var(--accent); stroke-width: 2; }
.svg-line.dim { stroke: var(--dim); }
.svg-arrowhead { fill: var(--muted); }
.svg-arrowhead.hot { fill: var(--accent); }
.svg-arrowhead.dim { fill: var(--dim); }
.svg-line.loop { stroke-dasharray: 5 4; }
.svg-bar { fill: var(--accent); }
.svg-bar.low { fill: var(--mark); }
.svg-grid { stroke: var(--line); stroke-width: 1; }
.svg-overlap { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 1; }
.svg-group { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.svg-group.dim { stroke: var(--dim); stroke-width: 1; }
.token-rows { display: flex; flex-direction: column; gap: 12px; padding: 6px 4px; }
.token-row-label { font-size: var(--step--1); color: var(--muted); margin-bottom: 6px; }
.token-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.token-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 8px 4px; border-radius: 4px; background: var(--surface-2); min-width: 2.2em; }
.token-chip.hot { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.token-chip.hot .token-text { font-weight: 600; }
.token-text { font-family: var(--font-code); font-size: 0.875rem; white-space: pre; }
.token-space { color: var(--muted); }
.token-id { font-family: var(--font-code); font-size: 0.6875rem; color: var(--muted); }
.svg-point { fill: var(--muted); }
.svg-point.hot { fill: var(--accent); }
.svg-cell.ramp-0 { fill: var(--ramp-0); } .svg-text.ramp-text-0 { fill: var(--ramp-text-0); }
.svg-cell.ramp-1 { fill: var(--ramp-1); } .svg-text.ramp-text-1 { fill: var(--ramp-text-1); }
.svg-cell.ramp-2 { fill: var(--ramp-2); } .svg-text.ramp-text-2 { fill: var(--ramp-text-2); }
.svg-cell.ramp-3 { fill: var(--ramp-3); } .svg-text.ramp-text-3 { fill: var(--ramp-text-3); }
.svg-cell.ramp-4 { fill: var(--ramp-4); } .svg-text.ramp-text-4 { fill: var(--ramp-text-4); }
.svg-cell.ramp-5 { fill: var(--ramp-5); } .svg-text.ramp-text-5 { fill: var(--ramp-text-5); }
.svg-cell-frame { fill: none; stroke: var(--line); }
.svg-cell-frame.hot { stroke: var(--ink); stroke-width: 1.5; }
.frame-control { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px 10px; }
.frame-control label { font-size: 0.875rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.frame-control label strong { color: var(--ink); }
.frame-control input[type=range] { width: 100%; accent-color: var(--accent); min-height: var(--tap); }
.switch.frames { overflow-x: visible; }
/* Stepped pictures: every step sits in the same grid cell, so the box keeps the tallest step's height and the page never jumps */
.frame-stack { display: grid; }
.frame-layer { grid-area: 1 / 1; visibility: hidden; min-width: 0; }
.frame-layer.current { visibility: visible; }
.frame-stack.animated .frame-layer.leaving { visibility: visible; }
.frame-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--tap); }
.frame-head .token-row-label { margin: 0; }
.frame-head label { flex: 1; }
/* kind: tiles. Doors, cups, cards, slots: a row of labelled boxes with a state */
.svg-box.picked { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.svg-text.big { font-size: 15px; font-weight: 600; }
/* Play: games dealt on the page from a computed case table */
.play { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.deal-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.deal-grid.ten { grid-template-columns: repeat(10, 1fr); }
.deal-cell { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--font-code); font-size: 0.6875rem; background: var(--surface-2); color: var(--muted); }
.deal-cell.hot { background: var(--accent); color: var(--on-accent); font-weight: 600; }

// Each game lands in one case of the case table, which code worked out at build time (with its chance as a weight).
// A fresh deal is random on purpose: evidence the learner makes is evidence they trust. Read-along shows the
// seeded sample deal kept in the blueprint, so screenshots and tests are the same every time.
