                  - label: Door 7
                    group: The other 9
                    state: closed
                  - label: Door 8
                    group: The other 9
                    state: open
                    inside: goat
                  - label: Door 9
                    group: The other 9
                    state: open
                    inside: goat
                  - label: Door 10
                    group: The other 9
                    state: open
                    inside: goat
            - label: The offer
              caption: Door 7 is all that is left of the other 9, so it holds their 9 in 10.
              figure:
                kind: tiles
                tiles:
                  - label: Door 1
                    group: Yours
                    state: picked
                    note: yours
                  - label: Door 2
                    group: The other 9
                    state: open
                    inside: goat
