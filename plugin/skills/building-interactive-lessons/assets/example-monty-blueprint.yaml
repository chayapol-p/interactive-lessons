rect x="64" y="148" width="34" height="30" rx="4" class="svg-box "/><text x="81" y="167" text-anchor="middle" class="svg-text small">goat</text><rect x="104" y="148" width="34" height="30" rx="4" class="svg-box ghost"/><text x="121" y="167" text-anchor="middle" class="svg-text small dim">open</text><rect x="144" y="148" width="34" height="30" rx="4" class="svg-box hot"/><text x="161" y="167" text-anchor="middle" class="svg-text small">car</text><text x="64" y="192" class="svg-text small dim">he must open 2</text><text x="232" y="167" text-anchor="middle" class="svg-text dim">✗</text><text x="300" y="167" text-anchor="middle" class="svg-text hot">✓ wins</text></svg>
      - id: one-case-idea
        type: idea
        text: "Picture 300 games: in about 100 the car is behind your door, and whichever door the host opens, staying wins those 100. In the other 200 he has no choice, and switching wins them all."
      - id: even-check
        type: check
        purpose: pitfall
        tests: two-doors-even
        question: "A friend says: \"Once a goat is shown, two doors are left, so it's 1 in 2 each.\" Using the case table, what is the flaw?"
        options:
          - {text: "There are 3 equally likely cases, and the other door wins 2 of them", correct: true, why_right: "Counting doors left is not counting cases."}
          - {text: "Nothing: once a door opens, the two left share the chance like a coin", correct: false, why_wrong: "Opening a door is not a new coin toss; the table shows switching winning 2 of 3 cases."}
          - {text: "Your door gains the opened door's share, so staying is now better", correct: false, why_wrong: "The host never touches your door; the opened door's share goes to the other closed door."}
      - id: even-pitfall
        type: pitfall
        misconception: two-doors-even
      - id: feel-recap
        type: recap
        text: List every case. Your pick is right 1 time in 3, and switching wins in every case where it was wrong, 2 times in 3.
        sums_up: [cases-idea, cases-table]

  # ---------------------------------------------------------------- 3 · the mechanism
  - id: why-it-works
    title: Why
    minutes: 5
    beat: [mechanism]
    milestone: "I can explain where the 2 in 3 comes from."
    open_question: "Would switching still win if the host did not know where the car is?"
    why_it_matters: Knowing that switching wins is not the same as seeing why. This chapter makes it something you can explain to anyone.
    must_know:
      - Your door keeps its 1 in 3 when the host opens a door.
      - The other two doors share 2 in 3, and the host's reveal moves all of it onto the one he leaves shut.
    must_get_right:
      - id: track-chance
        can_do: Say each door's chance before and after the host opens his door.
        evidence: The learner picks door 2's chance after the reveal; each wrong pick shows the worked chances.
        objective: explain-why
        tested_by: [after-chance]
      - id: more-doors
        can_do: Apply the two groups to a game with 4 doors.
        evidence: A key check with 4 doors, which the chapter never showed.
        objective: explain-why
        tested_by: [groups-check]
    brings_in: [first-pick-third, host-rules]
    carries_forward:
      - id: host-knows
        idea: The host knows where the car is, so the door he leaves shut collects the other doors' whole chance.
        used_in: [when-it-fails]
        shown_by: [groups-idea, before-after]
    misconceptions: [host-resets-odds]
    bridge_in:
      text: Your first pick is right 1 time in 3, and switching wins whenever it was wrong. Now follow the chance itself, door by door.
      recalls: [first-pick-third]
    bridge_out:
      text: Next, take away what the host knows, and watch what happens to the odds.
      points_to: when-it-fails
    blocks:
      - id: predict-after
        type: predict
        question: "Before the host opens anything, your door 1 has a 1 in 3 chance. He opens door 3 and shows a goat. What is your door's chance now?"
        options:
          - {text: "1 in 2, now that two doors are left", correct: false, why_wrong: "Whatever is behind your door, he can always find a goat to show, so your door keeps its 1 in 3."}
          - {text: "Still 1 in 3", correct: true, why_right: "Nothing about your door changed."}
          - {text: "Less than 1 in 3", correct: false, why_wrong: "Nothing happened to your door; it keeps what it had."}
      - id: groups-idea
        type: idea
        key: true
        text: "Split the doors: yours, with 1 in 3, and the other two, with 2 in 3. The host can always find a goat among the other two, so nothing changes for yours, and their whole 2 in 3 lands on the door he keeps shut."
      - id: before-after
        type: diagram
        shape: change-over-time
        brief:
          understand: "Tap through the steps and watch the bars: the reveal moves door 3's share onto door 2, never onto your door."
          how_it_helps: "Bars out of 100 games: each door (33, 33, 33), the two groups (33 against 67), and after the reveal (33, 67, 0)."
          clearer_than_text: Watching door 2's bar double while yours stays put shows where the 2 in 3 comes from.
        motion:
          changes: Door 3's share of the games moves onto door 2 when the host opens door 3.
          stays: Your door's bar, at 33 games in 100, through every step.
          why_not_still: Where the share goes is the idea, and only the move shows it landing on door 2 and never on yours.
          learner_does: step
          breaks: host-resets-odds
        figure:
          kind: frames
          control: buttons
          control_label: Step
          animate: true
          computed_by:
            language: python
            code: |
              import json
              from monty import door_chances
              names = ["Door 1 (yours)", "Door 2", "Door 3"]   # one decimal, so the bars add up to 100
              def bar(name, chance, note=None):
                  return {"label": name, "value": round(100 * float(chance), 1), "note": note or (f"{chance.numerator} in {chance.denominator}" if chance else "opened")}
              before, after = door_chances(3, False), door_chances(3, True)
              frames = [
                  {"label": "Before", "caption": "Each door wins about 33 games in 100.",
                   "figure": {"kind": "bars", "max": 100, "bars": [bar(n, c) for n, c in zip(names, before)]}},
                  {"label": "Two groups", "caption": "Your door: 33. The other two together: 67.",
                   "figure": {"kind": "bars", "max": 100, "bars": [bar(names[0], before[0]), bar("Doors 2 + 3", before[1] + before[2], "together")]}},
                  {"label": "After", "caption": "Door 3 is open (a goat), so door 2 holds all 67.",
                   "figure": {"kind": "bars", "max": 100, "bars": [bar(n, c) for n, c in zip(names, after)]}},
              ]
              print(json.dumps({"frames": frames}))
          frames:
            - label: Before
              caption: Each door wins about 33 games in 100.
              figure:
                kind: bars
                max: 100
                bars:
                  - label: Door 1 (yours)
                    value: 33.3
                    note: 1 in 3
                  - label: Door 2
                    value: 33.3
                    note: 1 in 3
                  - label: Door 3
                    value: 33.3
                    note: 1 in 3
            - label: Two groups
              caption: 'Your door: 33. The other two together: 67.'
              figure:
                kind: bars
                max: 100
                bars:
                  - label: Door 1 (yours)
                    value: 33.3
                    note: 1 in 3
                  - label: Doors 2 + 3
                    value: 66.7
                    note: together
            - label: After
              caption: Door 3 is open (a goat), so door 2 holds all 67.
              figure:
                kind: bars
                max: 100
                bars:
                  - label: Door 1 (yours)
                    value: 33.3
                    note: 1 in 3
                  - label: Door 2
                    value: 66.7
                    note: 2 in 3
                  - label: Door 3
                    value: 0.0
                    note: opened
      - id: groups-check
        type: check
        purpose: key
        tests: groups-idea
        question: "Four doors, one car. You pick door 1; the host, who knows, opens 2 goat doors and leaves door 4 shut. How often does switching to door 4 win?"
        options:
          - {text: "3 times in 4", correct: true, why_right: "Your door keeps 1 in 4; the other group's 3 in 4 all lands on door 4."}
          - {text: "1 time in 2", correct: false, why_wrong: "Two doors are left, but the host chose which one to keep shut."}
          - {text: "1 time in 4", correct: false, why_wrong: "That is your own door's chance."}
      - id: after-chance
        type: fill_blanks
        instructions:
          - Fill the blank with door 2's chance after the host opens door 3.
          - Check shows the worked chances for your choice.
        language: text
        source: the two groups
        context_note: The game with 3 doors, after the host has opened door 3.
        text: "After the host opens door 3, door 2's chance of hiding the car is {{chance}}."
        blanks:
          - id: chance
            options:
              - text: 2 in 3
                correct: true
                why_right: Door 2 now holds the whole 2 in 3 that doors 2 and 3 shared.
                output: "Door 1 stays at 1 in 3. Doors 2 and 3 had 2 in 3 together; door 3 is out, so door 2 holds all 2 in 3."
                output_from: worked
                output_source: counting the cases
              - text: 1 in 2
                correct: false
                why_wrong: The reveal is not a new game; your door keeps its 1 in 3.
                misconception: host-resets-odds
                output: "1 in 2 would mean your door's chance grew from 1 in 3, but the host never touches your door. Door 2 holds 2 in 3."
                output_from: worked
                output_source: counting the cases
              - text: 1 in 3, like before
                correct: false
                why_wrong: Door 3's share cannot vanish, and it cannot move to your door.
                misconception: two-doors-even
                output: "Then the chances would add up to only 2 in 3. Door 3's share moves onto door 2: 1 in 3 plus 1 in 3 makes 2 in 3."
                output_from: worked
                output_source: counting the cases
        hints:
          - Chances always add up to 1. Which door can door 3's share move to?
      - id: reset-pitfall
        type: pitfall
        misconception: host-resets-odds
      - id: why-recap
        type: recap
        text: Your door keeps its 1 in 3; the host moves the other doors' whole 2 in 3 onto the one he leaves shut.
        sums_up: [groups-idea, before-after]

  # ---------------------------------------------------------------- 4 · the boundary
  - id: when-it-fails
    title: When it fails
    minutes: 5
    beat: [boundary]
    milestone: "I can say when switching stops helping."
    open_question: "Where else does someone who knows act before you choose?"
    why_it_matters: Change one thing about the host, and see whether your answer still holds.
    must_know:
      - A host who guesses sometimes reveals the car, which ends the game.
      - When a guessing host happens to show a goat, the two closed doors are even.
    must_get_right:
      - id: guessing-host
        can_do: List the guessing host's moves and count the wins.
        evidence: The learner fills in the switching wins for a guessing host, then judges two shows they have not seen.
        objective: explain-host
        tested_by: [guess-count, host-key-check]
    brings_in: [host-knows]
    carries_forward:
      - id: knowledge-sets-odds
        idea: What the other side knows when it acts is what sets the odds.
        used_in: [use-it]
        shown_by: [host-idea, guesses-table]
    misconceptions: [always-switch]
    bridge_in:
      text: The 2 in 3 came from a host who knows where the car is. Now take that knowledge away.
      recalls: [host-knows]
    bridge_out:
      text: Next, use the idea on a game with no doors at all.
      points_to: use-it
    blocks:
      - id: predict-guess
        type: predict
        question: "This time the host does not know where the car is. He opens door 3 at random, and it happens to be a goat. Should you switch?"
        options:
          - {text: "Yes, switching still wins 2 in 3", correct: false, why_wrong: "The 2 in 3 needed a host who knew."}
          - {text: "It no longer matters: both are even", correct: true, why_right: "A goat he found by luck gives the other closed door no extra chance."}
          - {text: "No, staying now wins more often", correct: false, why_wrong: "Neither door is favoured; the guess carries no information."}
      - id: host-idea
        type: idea
        key: true
        text: "Same goat, different meaning: a host who knows can never show the car, but a guesser can. In the 2 of 6 ways the game goes where a guesser shows the car, the knowing host opens the other door, so switching wins."
      - id: deal-knowing
        type: play
        prompt: "A host who knows: deal 100 games and count the wins."
        deals: [100]
        outcomes:
          - {id: stay-wins, label: Staying wins, short: St}
          - {id: switch-wins, label: Switching wins, short: Sw, hot: true}
        computed_by:
          language: python
          code: |
            import json
            from monty import knowing_host_cases, sample
            cases = knowing_host_cases()
            print(json.dumps({"cases": cases, "sample": sample(cases, ["stay-wins", "switch-wins"], seed=31)}))
        cases:
          - label: Car behind door 1
            weight: 0.3333333333333333
            outcome: stay-wins
          - label: Car behind door 2
            weight: 0.3333333333333333
            outcome: switch-wins
          - label: Car behind door 3
            weight: 0.3333333333333333
            outcome: switch-wins
        sample:
          games: 100
          seed: 31
          counts:
            stay-wins: 34
            switch-wins: 66
      - id: deal-guessing
        type: play
        prompt: "A host who guesses: deal 100 games. When he opens the car's door, the game is over; compare staying and switching in the rest."
        deals: [100]
        outcomes:
          - {id: stay-wins, label: Staying wins, short: St}
          - {id: switch-wins, label: Switching wins, short: Sw, hot: true}
          - {id: car-shown, label: He shows the car, short: X}
        computed_by:
          language: python
          code: |
            import json
            from monty import guessing_host_cases, sample
            cases = guessing_host_cases()
            print(json.dumps({"cases": cases, "sample": sample(cases, ["stay-wins", "switch-wins", "car-shown"], seed=1034)}))
        cases:
          - label: Car 1, he opens 2
            weight: 0.16666666666666666
            outcome: stay-wins
          - label: Car 1, he opens 3
            weight: 0.16666666666666666
            outcome: stay-wins
          - label: Car 2, he opens 2
            weight: 0.16666666666666666
            outcome: car-shown
          - label: Car 2, he opens 3
            weight: 0.16666666666666666
            outcome: switch-wins
          - label: Car 3, he opens 2
            weight: 0.16666666666666666
            outcome: switch-wins
          - label: Car 3, he opens 3
            weight: 0.16666666666666666
            outcome: car-shown
        sample:
          games: 100
          seed: 1034
          counts:
            stay-wins: 35
            switch-wins: 32
            car-shown: 33
      - id: guesses-table
        type: diagram
        shape: comparison
        brief:
          understand: The host who knows turns the 2 'shows the car' games into switching wins; the host who guesses throws them away.
          how_it_helps: "Six rows, one per equally likely way the game goes (3 car spots × 2 doors he might open), with the two hosts side by side."
          clearer_than_text: Seeing the same two rows end differently for the two hosts shows exactly where the 2 in 3 comes from.
        figure:
          kind: svg
          svg: |
            <svg viewBox="0 0 340 308" role="img" aria-label="The same 6 equally likely moves for two hosts. A host who guesses shows the car in 2 of them, so those games end; of the 4 left, staying wins 2 and switching 2. A host who knows opens the other door in those 2 moves, so they become switching wins: staying 2, switching 4 of 6."><text x="4" y="18" class="svg-text small">Car / host picks</text><text x="132" y="18" class="svg-text small">Host guesses</text><text x="240" y="18" class="svg-text small">Host knows</text><text x="4" y="44" class="svg-text small">Car 1, host</text><text x="4" y="58" class="svg-text small">picks door 2</text><text x="132" y="44" class="svg-text small">stay ✓</text><text x="240" y="44" class="svg-text small">stay ✓</text><text x="4" y="84" class="svg-text small">Car 1, host</text><text x="4" y="98" class="svg-text small">picks door 3</text><text x="132" y="84" class="svg-text small">stay ✓</text><text x="240" y="84" class="svg-text small">stay ✓</text><text x="4" y="124" class="svg-text small">Car 2, host</text><text x="4" y="138" class="svg-text small">picks door 2</text><text x="132" y="124" class="svg-text small dim">shows the car</text><text x="132" y="138" class="svg-text small dim">game over</text><text x="240" y="124" class="svg-text small hot">switch ✓</text><text x="240" y="138" class="svg-text small">skips it, opens 3</text><text x="4" y="164" class="svg-text small">Car 2, host</text><text x="4" y="178" class="svg-text small">picks door 3</text><text x="132" y="164" class="svg-text small hot">switch ✓</text><text x="240" y="164" class="svg-text small hot">switch ✓</text><text x="4" y="204" class="svg-text small">Car 3, host</text><text x="4" y="218" class="svg-text small">picks door 2</text><text x="132" y="204" class="svg-text small hot">switch ✓</text><text x="240" y="204" class="svg-text small hot">switch ✓</text><text x="4" y="244" class="svg-text small">Car 3, host</text><text x="4" y="258" class="svg-text small">picks door 3</text><text x="132" y="244" class="svg-text small dim">shows the car</text><text x="132" y="258" class="svg-text small dim">game over</text><text x="240" y="244" class="svg-text small hot">switch ✓</text><text x="240" y="258" class="svg-text small">skips it, opens 2</text><line x1="4" y1="266" x2="336" y2="266" class="svg-line dim"/><text x="4" y="286" class="svg-text small">Wins</text><text x="132" y="286" class="svg-text small">stay 2, switch 2</text><text x="132" y="300" class="svg-text small dim">of 4 games left</text><text x="240" y="286" class="svg-text small hot">stay 2, switch 4</text><text x="240" y="300" class="svg-text small dim">of 6</text></svg>
      - id: host-key-check
        type: check
        purpose: key
        tests: host-idea
        question: "Two shows run tonight. In Show A the host knows where the car is; in Show B he picks a door at random. Both hosts open a door and show a goat. Where does switching help?"
        options:
          - {text: "Only in Show A", correct: true, why_right: "Only a host who knows moves chance onto the door he leaves shut."}
          - {text: "In both shows", correct: false, why_wrong: "Show B's goat was luck; its table splits 2 and 2."}
          - {text: "In neither show", correct: false, why_wrong: "Show A's host had to leave the car shut whenever your pick was wrong."}
      - id: guess-count
        type: fill_blanks
        instructions:
          - Fill the blank with how many of the 4 games left switching wins.
          - Check shows what the table says.
        language: text
        source: the guessing host's column of the table
        context_note: The table above; only the moves that show a goat count.
        text: "When the host guesses and shows a goat, switching wins {{count}} of the 4 games left."
        blanks:
          - id: count
            options:
              - text: "2"
                correct: true
                why_right: Switching wins when the car is behind door 2 and he opens 3, or behind door 3 and he opens 2; staying wins the other 2.
                output: "Switching wins 2 of 4 and staying wins 2 of 4: they are even. The guessing host's deal shows the same: staying and switching come out about level."
                output_from: worked
                output_source: the case table above
              - text: "3, still 2 in 3 or so"
                correct: false
                why_wrong: The 2 in 3 came from a host who knows; a guess carries no information.
                misconception: always-switch
                output: "Only 2 of the 4 rows end in a switching win. The rows where a knowing host would have been forced to open a goat door are now split by luck."
                output_from: worked
                output_source: the case table above
              - text: "1"
                correct: false
                why_wrong: Count the switching ticks again; there are 2.
                misconception: host-resets-odds
                output: "Switching wins 2 of the 4 goat moves: car behind 2 with door 3 opened, and car behind 3 with door 2 opened."
                output_from: worked
                output_source: the case table above
        hints:
          - Cross out the rows that show the car, then count the switching ticks.
      - id: always-pitfall
        type: pitfall
        misconception: always-switch
      - id: fails-recap
        type: recap
        text: The odds come from what the host knew when he acted; a host who guesses leaves the two doors even.
        sums_up: [host-idea, guesses-table]

  # ---------------------------------------------------------------- 5 · transfer and payoff
  - id: use-it
    title: Use it
    minutes: 5
    beat: [transfer, payoff]
    milestone: "I can use it on a new case, and answer the first question."
    why_it_matters: An idea you can use only on three doors is a trick; one you can use anywhere is yours.
    must_know:
      - When someone who knows acts before you choose, the choice they were not allowed to touch carries the chance.
    must_get_right:
      - id: transfer
        can_do: Use the idea on a quiz with 4 answers, and say when it stops working.
        evidence: The learner fills in the switching cases for a new game, then judges a friend who guesses.
        objective: use-new-case
        tested_by: [quiz-count, quiz-key-check]
      - id: payoff
        can_do: Answer the first question of the lesson and say why.
        evidence: A short explanation in the learner's own words, graded against a rubric.
        objective: explain-why
        tested_by: [payoff-explain]
    brings_in: [knowledge-sets-odds]
    carries_forward:
      - id: ask-what-they-knew
        idea: When someone who knows acts before you choose, the choice they were not allowed to touch carries the chance.
        used_in: [beyond]
        shown_by: [quiz-idea, quiz-tiles]
    misconceptions: []
    bridge_in:
      text: What the other side knows when it acts is what sets the odds. Here is the same game with no doors at all.
      recalls: [knowledge-sets-odds]
    bridge_out:
      text: Look for it in quiz shows, card games and sales offers, anywhere someone who knows moves first.
      points_to: beyond
    blocks:
      - id: predict-quiz
        type: predict
        question: "A quiz with 4 answers: A, B, C and D. You pick A. A friend who has seen the answer sheet crosses out B and D, two wrong answers that are not yours. Stay with A, or switch to C?"
        options:
          - {text: "Switch to C", correct: true, why_right: "A was a 1 in 4 guess; whenever A was wrong, she could not cross out the right answer, so C is it."}
          - {text: "Stay with A", correct: false, why_wrong: "Her crossing out never touched A, so A is still a 1 in 4 guess."}
          - {text: "It's 50/50 now", correct: false, why_wrong: "Two answers are left, but she chose which wrong ones to cross out, and you did not."}
      - id: quiz-idea
        type: idea
        key: true
        text: "Your pick is right 1 time in 4, and your friend, who knows, never crosses out the right answer. So the one answer left beside yours holds the other 3 in 4."
      - id: quiz-tiles
        type: diagram
        shape: structure
        brief:
          understand: Your answer against the other three. Your friend crossed out two of them, and one is left.
          how_it_helps: "Four answers as tiles: yours picked, two crossed out, and the one she could not cross out."
          clearer_than_text: It is the three doors again, with one more door; the picture makes the match plain.
        figure:
          kind: tiles
          tiles:
            - {label: A, state: picked, note: yours, group: Yours}
            - {label: B, state: open, inside: "✗", note: crossed, group: The other three}
            - {label: C, state: hot, note: left, group: The other three}
            - {label: D, state: open, inside: "✗", note: crossed, group: The other three}
      - id: quiz-count
        type: fill_blanks
        instructions:
          - Fill the blank with how many of the 4 equally likely cases switching to the answer left wins.
          - Check shows the worked cases for your choice.
        language: text
        source: the four cases of the quiz
        context_note: The quiz above; each of A, B, C and D is equally likely to be right.
        text: "Switching to the answer left wins in {{count}} of the 4 equally likely cases."
        blanks:
          - id: count
            options:
              - text: "3"
                correct: true
                why_right: Switching wins whenever A was wrong, which is 3 of the 4 cases.
                output: "A right: staying wins. B, C or D right: she leaves that answer, and switching wins. That is 3 of 4."
                output_from: worked
                output_source: listing the 4 cases
              - text: "2, one for each answer left"
                correct: false
                why_wrong: Two answers are left, but there are 4 equally likely cases, not 2.
                misconception: two-doors-even
                output: "Count cases, not answers left: A, B, C or D can be right, and switching wins in 3 of those 4."
                output_from: worked
                output_source: listing the 4 cases
              - text: "1"
                correct: false
                why_wrong: That is staying's count, the case where A was right all along.
                misconception: host-resets-odds
                output: "Staying wins 1 case, A right. Switching wins the other 3."
                output_from: worked
                output_source: listing the 4 cases
        hints:
          - In how many of the 4 cases is A wrong?
      - id: quiz-key-check
        type: check
        purpose: key
        tests: quiz-idea
        question: "Same quiz, but this friend has not seen the sheet. She crosses out 2 of the other answers at random, and by luck neither is the right answer. Stay or switch?"
        options:
          - {text: "Either: the two left are even", correct: true, why_right: "Her luck carries no knowledge, so neither answer gains."}
          - {text: "Switch: it still wins 3 in 4", correct: false, why_wrong: "The 3 in 4 needed a friend who knows; a guess carries nothing."}
          - {text: "Stay: yours was not crossed out", correct: false, why_wrong: "Not being crossed out by luck gives yours no more chance than the other."}
      - id: payoff-explain
        type: explain
        instructions:
          - "Back to the first question: you picked door 1, and the host, who knows, opened door 3 to show a goat."
          - In two sentences, say whether to switch to door 2, and why.
        reference_solution: "Switch. My pick was right only 1 time in 3, and whenever it was wrong the host had to leave the car behind door 2, so switching wins 2 times in 3."
        rubric:
          - {criterion: "Gives the choice", passing: "Says to switch to door 2."}
          - {criterion: "Names the first pick's chance", passing: "Says the first pick is right only 1 time in 3."}
          - {criterion: "Uses what the host knows", passing: "Says the host knows and must leave the car shut when the pick was wrong."}
        hints:
          - How often was door 1 right to begin with?
          - When door 1 was wrong, which door did the host have to leave shut?
        common_wrong_answers:
          - {answer: "It doesn't matter, it's 50/50.", misconception: two-doors-even, hint: "Count cases, not doors left."}
      - id: use-recap
        type: recap
        text: When someone who knows acts before you choose, ask what they were not allowed to touch.
        sums_up: [quiz-idea, quiz-tiles]
