                    inside: goat
      - id: deal-games
        type: play
        prompt: "Back to 3 doors and a host who knows. Deal 100 games and count who would win: staying with door 1, or switching."
        deals: [10, 100]
        outcomes:
          - {id: stay-wins, label: Staying wins, short: St}
          - {id: switch-wins, label: Switching wins, short: Sw, hot: true}
        computed_by:
          language: python
          code: |
            import json
            from monty import knowing_host_cases, sample
            cases = knowing_host_cases()
            print(json.dumps({"cases": cases, "sample": sample(cases, ["stay-wins", "switch-wins"], seed=7)}))
        cases:
          - label: Car behind door 1
            weight: 0.3333333333333333
            outcome: stay-wins
          - label: Car behind door 2
            weight: 0.3333333333333333
            outcome: switch-wins
          - label: Car behind door 3
            weight: 0.3333333333333333
            outcome: switch-wins
        sample:
          games: 100
          seed: 7
          counts:
            stay-wins: 37
            switch-wins: 63
      - id: cases-idea
        type: idea
        text: "Don't argue: list every case, each equally likely, with your pick always door 1. When the car is behind door 2 or 3, the host has only one goat door to open, so the other closed door hides the car."
        more: "Try it at home with three cups and a coin. A friend hides the coin and, after you pick a cup, lifts an empty one you didn't pick. Play 15 rounds staying and 15 switching, and count the coins."
      - id: cases-table
        type: diagram
        shape: comparison
        brief:
          understand: Each row is one place the car can be, equally likely. Count the ticks in each column.
          how_it_helps: "One row per place the car can be. Each row shows the three doors, the door the host must open, and whether staying or switching wins."
          clearer_than_text: Seeing two of the three rows end in a switching win settles the argument in one look.
