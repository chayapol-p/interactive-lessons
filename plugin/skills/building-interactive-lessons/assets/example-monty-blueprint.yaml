# Small example with no code: the Monty Hall problem, in 5 chapters (about 25 minutes), told as one story.
# The game (the puzzle and your gut answer) · Feel it (100 doors, deal 100 games, every case) · Why (the chance slides
# onto one door) · When it fails (a host who guesses) · Use it (a quiz with no doors, then back to the first question).
# Every chance is worked out by code (shared_modules: monty). The two case tables (cases-table, guesses-table) are svg
# figures whose rows were written by code that lists every case; write them the same way if the game changes.

lesson:
  title: Stay or Switch?
  big_idea: "Switching wins 2 in 3 because the host knows where the car is: whenever your first pick was wrong, he must leave the car behind the other closed door."
  role: standalone
  learner:
    knows: [basic chance, such as a coin landing heads half the time]
    new_to: the Monty Hall puzzle, three doors and a game-show host
    wants_to: see why switching wins in the Monty Hall game, well enough to explain it to a friend
    time_minutes: 25
    assumed: true
    assumption_note: It is written for someone new to probability. If you already know the puzzle, start at chapter 3.
  objectives:
    - id: list-cases
      text: After this, you can list every case of the game and count who wins.
    - id: explain-why
      text: After this, you can explain where switching's extra chance comes from.
    - id: explain-host
      text: After this, you can say when switching stops helping, and why.
    - id: use-new-case
      text: After this, you can use the idea on a new case where someone who knows acts first.
  agreed_extras: [animation, play]
  source: "Selvin (1975), letters to The American Statistician; vos Savant (1990), Parade; Tierney (1991), The New York Times; cases and chances worked out by code for this lesson"

theme:
  name: Game-show magenta
  accent: "#b5179e"
  why: A bold magenta from the world of game-show lights; red itself is kept for wrong answers.

glossary:
  - term: host
    definition: The person who runs the game. In the classic game he knows where the car is.
  - term: case
    definition: One way the game can turn out, such as "the car is behind door 2". Here every case is equally likely.

known_ideas:
  - id: known-even-chance
    idea: When every outcome is equally likely, each has the same chance, such as 1 in 2 for a coin.

facts:
  - id: fact-rules
    statement: "In the classic game, the host always opens a door you did not pick, always shows a goat, and always offers the switch."
    status: confirmed
    source: "Selvin (1975), The American Statistician 29(1); vos Savant (1990), Parade"
  - id: fact-letters
    statement: "After vos Savant answered 'switch' in Parade in September 1990, about 10,000 readers wrote in, nearly 1,000 of them with PhDs, most saying she was wrong."
    status: confirmed
    source: "Tierney (1991), Behind Monty Hall's Doors: Puzzle, Debate and Answer, The New York Times, 21 July 1991"
  - id: fact-two-thirds
    statement: Under those rules, switching wins 2 in 3 games and staying wins 1 in 3.
    status: confirmed
    source: "vos Savant (1990), Parade; the case table worked out for this lesson"
  - id: fact-many-doors
    statement: With n doors and a host who opens every other goat door, switching wins (n − 1) in n games.
    status: confirmed
    source: worked out by code for this lesson (exact fractions)
  - id: fact-guessing-host
    statement: A host who opens a random door you did not pick shows the car in 2 of 6 equally likely moves; in the other 4, staying and switching each win 2.
    status: confirmed
    source: the case table worked out for this lesson
  - id: fact-quiz
    statement: "In a 4-answer quiz, if a friend who knows the answers crosses out 2 wrong ones you did not pick, switching wins 3 in 4. If she crosses out 2 at random and happens to spare the right one, the two answers left are even."
    status: confirmed
    source: worked out for this lesson (exact fractions)

misconceptions:
  - id: two-doors-even
    wrong_idea: Two doors are left, so each has a 1 in 2 chance.
    why_people_believe_it: Two closed doors look like a coin toss.
    what_is_true: The doors are not alike. Yours was picked at random from 3; the other was kept shut by a host who knows where the car is.
    source: "vos Savant (1990), Parade"
  - id: host-resets-odds
    wrong_idea: Opening a door starts a new game, so the odds are shared out again between the doors left.
    why_people_believe_it: After the reveal it feels like a fresh choice between two doors.
    what_is_true: Nothing about your first pick changed. Your door keeps its 1 in 3, and the other two doors' 2 in 3 ends up on the one the host leaves shut.
    source: worked out for this lesson
  - id: always-switch
    wrong_idea: Switching always wins 2 in 3, whatever the host does.
    why_people_believe_it: People who have heard of the puzzle remember the answer as "always switch".
    what_is_true: The 2 in 3 comes from a host who knows. A host who guesses and happens to show a goat leaves the two doors even.
    source: the case table for this lesson

shared_modules:
  monty: |
    """The Monty Hall game worked out by listing cases, with exact fractions."""
    from fractions import Fraction

    DOORS = [1, 2, 3]
    PICK = 1   # you always pick door 1

    def door_chances(doors, host_has_opened):
        """Each door's chance of hiding the car; you pick door 1. After the host (who knows) opens every other goat door,
        door 1 keeps 1/n and the one door he leaves shut holds the rest."""
        yours = Fraction(1, doors)
        if not host_has_opened:
            return [yours] * doors
        return [yours, 1 - yours] + [Fraction(0)] * (doors - 2)

    def knowing_host_cases():
        """One case per place the car can be, each 1 in 3: staying wins only when the car is behind your door."""
        return [{"label": f"Car behind door {car}", "weight": float(Fraction(1, 3)),
                 "outcome": "stay-wins" if car == PICK else "switch-wins"} for car in DOORS]

    def guessing_host_cases():
        """Six equally likely moves: where the car is (3) times the door a guessing host opens (2 he did not pick).
        If he opens the car's door, the game is over."""
        cases = []
        for car in DOORS:
            for opened in [door for door in DOORS if door != PICK]:
                other = [door for door in DOORS if door not in (PICK, opened)][0]
                outcome = "car-shown" if opened == car else "stay-wins" if car == PICK else "switch-wins" if car == other else "stay-wins"
                cases.append({"label": f"Car {car}, he opens {opened}", "weight": float(Fraction(1, 6)), "outcome": outcome})
        return cases

    def sample(cases, outcomes, seed, games=100):
        """A seeded deal, kept in the blueprint so read-along and screenshots show the same games every time."""
        import random
        dealt = random.Random(seed).choices([c["outcome"] for c in cases], weights=[c["weight"] for c in cases], k=games)
        return {"games": games, "seed": seed, "counts": {outcome: dealt.count(outcome) for outcome in outcomes}}

chapters:

  # ---------------------------------------------------------------- 1 · the hook
  - id: the-game
    title: The game
    minutes: 5
    beat: [hook]
    milestone: "I can say the puzzle, its three rules, and a first guess."
    open_question: "Is it really 50/50 between the two closed doors?"
    why_it_matters: The answer feels obvious to almost everyone, and in 1990 thousands of experts got it wrong.
    must_know:
      - The host knows where the car is.
      - He always opens a goat door you did not pick, then offers the switch.
    must_get_right:
      - id: name-rules
        can_do: Say what the host knows and does, and spot which rule a changed game breaks.
        evidence: A key check on a changed game; a guess cannot name the broken rule.
        objective: explain-host
        tested_by: [rules-key-check]
    brings_in: [known-even-chance]
    carries_forward:
      - id: host-rules
        idea: The host knows where the car is and always opens a goat door you did not pick.
        used_in: [feel-it, why-it-works]
        shown_by: [rules-idea, game-picture]
    misconceptions: []
    bridge_in:
      text: You know that when every outcome is equally likely, each has the same chance. Two closed doors look just like that.
      recalls: [known-even-chance]
    bridge_out:
      text: Next, test your gut answer by dealing games and listing every case.
      points_to: feel-it
    blocks:
      - id: predict-game
        type: predict
        hold: true
        question: "Three doors: a car behind one, goats behind two. You pick door 1. The host, who knows where the car is, opens door 3 and shows a goat, then offers you door 2. What should you do?"
        options:
          - {text: "Stay with door 1", correct: false, why_wrong: "You pick a goat 2 times in 3, and then the host has to leave the car behind door 2."}
          - {text: "Switch to door 2", correct: true, why_right: "Door 2 wins whenever your first pick was wrong, which is 2 times in 3."}
          - {text: "It does not matter, it's 50/50", correct: false, why_wrong: "If you picked a goat, he had to open the other goat door, so door 2 hides the car."}
      - id: game-picture
        type: diagram
        shape: structure
        brief:
          understand: You hold door 1. The host has opened door 3 to show a goat, and door 2 is still shut.
          how_it_helps: "The three doors as tiles: yours picked, the opened one dashed with its goat, the offer closed."
          clearer_than_text: The two closed doors look alike, which is exactly the trap the lesson takes apart.
        figure:
          kind: tiles
          tiles:
            - {label: Door 1, state: picked, note: yours}
            - {label: Door 2, state: closed, note: the offer}
            - {label: Door 3, state: open, inside: goat, note: opened}
      - id: argument-idea
        type: idea
        text: "In 1990, Marilyn vos Savant answered this puzzle in Parade magazine: switch. About 10,000 readers wrote in, nearly 1,000 of them with PhDs, and most said she was wrong."
      - id: rules-idea
        type: idea
        key: true
        text: "Three rules make the game: the host knows where the car is, he always opens a door you did not pick that hides a goat, and he always offers the switch."
      - id: rules-key-check
        type: check
        purpose: key
        tests: rules-idea
        question: "A friend plays a version where the host opens a random door you did not pick, even if it hides the car. Which rule has changed?"
        options:
          - {text: "He no longer knows where the car is", correct: true, why_right: "A random door means he is not using what he knows, so he may show the car."}
          - {text: "He no longer offers you the switch", correct: false, why_wrong: "He still offers it; what changed is how he picks his door."}
          - {text: "You no longer get to pick first", correct: false, why_wrong: "You still pick first; the change is in the host's move."}
      - id: game-recap
        type: recap
        text: The host knows where the car is, opens a goat door you did not pick, and offers the switch.
        sums_up: [rules-idea, game-picture]

  # ---------------------------------------------------------------- 2 · intuition and proof
  - id: feel-it
    title: Feel it
    minutes: 5
    beat: [intuition, proof]
    milestone: "I can show that switching wins 2 in 3."
    open_question: "Your door never changes, so where does switching's extra chance come from?"
    why_it_matters: A big version makes the answer feel obvious; games you deal yourself and every case listed prove it.
    must_know:
      - With 100 doors, your pick is almost surely wrong, and the door the host leaves shut wins whenever it is.
      - Listing every case shows switching wins 2 of the 3 equally likely cases.
    must_get_right:
      - id: count-cases
        can_do: List the 3 cases, count that switching wins 2 of them, and spot why two closed doors are not 1 in 2.
        evidence: A spot-the-mistake check on the even-odds idea, answered before its card opens.
        objective: list-cases
        tested_by: [even-check]
    brings_in: [host-rules]
    carries_forward:
      - id: first-pick-third
        idea: Your first pick is right 1 time in 3, and switching wins in every case where it was wrong.
        used_in: [why-it-works]
        shown_by: [cases-idea, cases-table]
    misconceptions: [two-doors-even]
    bridge_in:
      text: The host knows where the car is and always shows a goat. So is it really 50/50? Make it bigger, then count.
      recalls: [host-rules]
    bridge_out:
      text: Next, follow the chance itself, door by door, to see where switching's wins come from.
      points_to: why-it-works
    blocks:
      - id: predict-hundred
        type: predict
        question: "Now 100 doors. You pick door 1. The host, who knows, opens 98 goat doors and leaves only door 57 shut. Stay or switch?"
        options:
          - {text: "Switch to door 57", correct: true, why_right: "Your door was a 1 in 100 guess; door 57 is the one he had to leave shut."}
          - {text: "Stay with door 1", correct: false, why_wrong: "Door 1 was a 1 in 100 guess, and opening other doors never improved it."}
          - {text: "It's 50/50 between the two", correct: false, why_wrong: "Two doors are left, but he chose which one to keep shut, and you did not."}
      - id: hundred-idea
        type: idea
        text: "With 100 doors your pick is right 1 time in 100, and whenever you missed, the host must leave the car shut. So the one door he leaves closed wins the other 99 times."
      - id: ten-doors
        type: diagram
        shape: change-over-time
        brief:
          understand: "The same game with 10 doors: watch the host open the other group, one door at a time, until one is left."
          how_it_helps: "Ten doors as tiles in two groups, yours and the other 9; the host's goats open one after another, leaving one door shut."
          clearer_than_text: Seeing 8 doors open in the other group while yours never moves shows that the left door carries the whole group's chance.
        motion:
          changes: The host's goat doors in the other group open, one after another.
          stays: Your door, its group and the one door left in the other group never move.
          why_not_still: The order matters here, because each door opens inside the other group only, so the eye sees that group shrink to one door.
          learner_does: step
          breaks: two-doors-even
        figure:
          kind: frames
          control: buttons
          control_label: Step
          animate: true
          computed_by:
            language: python
            code: |
              import json
              from fractions import Fraction
              from monty import PICK
              doors = list(range(1, 11))
              left = 7                       # in this run the car is behind door 7, so the host must leave it shut
              yours = Fraction(1, len(doors))
              def tiles(step):
                  row = []
                  for door in doors:
                      tile = {"label": f"Door {door}", "group": "Yours" if door == PICK else f"The other {len(doors) - 1}"}
                      if door == PICK:
                          tile.update(state="picked", note="yours")
                      elif step >= 1 and door != left:
                          tile.update(state="open", inside="goat")
                      else:
                          tile.update(state="hot" if step == 2 else "closed", **({"note": "left"} if step == 2 else {}))
                      row.append(tile)
                  return {"kind": "tiles", "tiles": row}
              captions = [f"Your door: {yours.numerator} in {yours.denominator}. The other {len(doors) - 1} together: {(1 - yours).numerator} in {(1 - yours).denominator}.",
                          f"The host, who knows, opens {len(doors) - 2} of the other {len(doors) - 1}: all goats.",
                          f"Door {left} is all that is left of the other {len(doors) - 1}, so it holds their {(1 - yours).numerator} in {(1 - yours).denominator}."]
              frames = [{"label": label, "caption": captions[step], "figure": tiles(step)}
                        for step, label in enumerate(["You pick", "Host opens", "The offer"])]
              print(json.dumps({"frames": frames}))
          frames:
            - label: You pick
              caption: 'Your door: 1 in 10. The other 9 together: 9 in 10.'
              figure:
                kind: tiles
                tiles:
                  - label: Door 1
                    group: Yours
                    state: picked
                    note: yours
                  - label: Door 2
                    group: The other 9
                    state: closed
                  - label: Door 3
                    group: The other 9
                    state: closed
