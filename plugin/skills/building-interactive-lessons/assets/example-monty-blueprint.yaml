                    group: The other 9
                    state: closed
                  - label: Door 5
                    group: The other 9
                    state: closed
                  - label: Door 6
                    group: The other 9
                    state: closed
                  - label: Door 7
                    group: The other 9
                    state: closed
                  - label: Door 8
                    group: The other 9
                    state: closed
                  - label: Door 9
                    group: The other 9
                    state: closed
                  - label: Door 10
                    group: The other 9
                    state: closed
            - label: Host opens
              caption: 'The host, who knows, opens 8 of the other 9: all goats.'
              figure:
                kind: tiles
                tiles:
                  - label: Door 1
                    group: Yours
                    state: picked
                    note: yours
                  - label: Door 2
                    group: The other 9
                    state: open
                    inside: goat
                  - label: Door 3
                    group: The other 9
                    state: open
                    inside: goat
                  - label: Door 4
                    group: The other 9
                    state: open
                    inside: goat
                  - label: Door 5
                    group: The other 9
