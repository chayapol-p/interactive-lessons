        options:
          - {text: "Each token can weigh every token in the window, near or far", correct: true, why_right: "That is the point of attention: distance does not decide the share."}
          - {text: "Nothing; the previous word decides the meaning", correct: false, why_wrong: "In the river sentence, the word before bank gets 0.02 of its attention."}
          - {text: "It is the word right after that matters most", correct: false, why_wrong: "Neither side wins by position; relevance wins."}
