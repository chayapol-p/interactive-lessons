  # ---------------------------------------------------------------- 4
  - id: layers
    title: Layers stack up understanding
    minutes: 8
    beat: [mechanism]
    milestone: "I can explain why models stack many layers."
    open_question: "After all those layers, how does the model choose the word it writes?"
    why_it_matters: One round of attention links words in pairs. Real understanding, such as working out what it refers to, comes from many rounds stacked.
    must_know:
      - A layer is attention followed by a small per-token refinement, and models stack many layers.
      - What each layer does is learned in training, not programmed.
    must_get_right:
      - id: why-many-layers
        can_do: Explain why a model needs many layers, not one.
        evidence: The grader checks the answer names building on the previous layer's result.
        objective: explain-context
        tested_by: [explain-layers, layers-key-check]
    brings_in: [meaning-in-context]
    carries_forward:
      - id: refined-meaning
        idea: After many layers, each token's embedding holds a refined, context-aware meaning that the last step reads.
        used_in: [next-token]
        shown_by: [layers-idea, pipeline-layers]
    misconceptions: [layers-are-programmed]
    bridge_in:
      text: One round of attention moves each token's embedding to fit its sentence, as bank moved toward water.
      recalls: [meaning-in-context]
    bridge_out:
      text: Next, the last layer's embedding is turned into odds for the next token, and one token is picked.
      points_to: next-token
    blocks:
      - id: predict-it
        type: predict
        question: "\"The trophy didn't fit in the suitcase because it was too big.\" What is too big, and could one quick look at the words settle it?"
        options:
          - {text: "The trophy, and it takes combining several clues", correct: true, why_right: "You need fit, too big and which thing goes inside the other, together."}
          - {text: "The suitcase, since it is the nearest noun to it", correct: false, why_wrong: "A suitcase that is too big would hold the trophy fine."}
      - id: layers-idea
        type: idea
        key: true
        text: "A layer is one round of attention, then a small refinement of each token on its own. Models stack many layers, so later layers combine clues that earlier ones linked in pairs."
        more: "Each layer works on the embeddings the previous one produced. The 2017 Transformer had 6 layers; today's large models have many more. Engineers choose how many layers and how big they are. What each layer ends up doing is learned in training, and researchers study it afterwards, much as you would study a trained model's features."
      - id: pipeline-layers
        type: diagram
        shape: flow
        brief:
          understand: Attention and refinement form one layer, and the arrow back up shows the layer repeating many times.
          how_it_helps: The chapter 3 pipeline with a refine box under attention and an arrow back up labelled repeat.
          clearer_than_text: The loop shows that depth, not a single step, builds understanding.
        figure:
          kind: flow
          parts:
            - {id: refine, label: Refine, note: each token alone, row: 4}
          links:
            - {from: attend, to: refine}
            - {from: refine, to: attend, label: repeat}
        extends:
          diagram: pipeline-attention
          adds: "a refine step after attention. Together they make one layer, and the layer repeats many times."
      - id: explain-layers
        type: explain
        instructions:
          - In two sentences, explain why a model stacks many layers instead of doing one big round of attention.
        reference_solution: Each layer works on the result of the one before, so later layers can combine links that earlier layers made, such as joining it, too big and fit to work out that the trophy is too big. One round can only link tokens in pairs from their starting meanings.
        rubric:
          - {criterion: "Builds on the previous layer", passing: "Says each layer works on the output of the layer before."}
          - {criterion: "Combines clues", passing: "Says later layers combine several links into a fuller meaning."}
        hints:
          - What does the second layer get as its input?
        common_wrong_answers:
          - {answer: "Each layer is programmed for a different grammar job.", misconception: layers-are-programmed, hint: "Who decides what a layer does: an engineer, or training?"}
      - id: programmed-pitfall
        type: pitfall
        misconception: layers-are-programmed
      - id: layers-key-check
        type: check
        purpose: key
        tests: layers-idea
        question: A smaller model with fewer layers misreads which person a pronoun points to in long sentences. What does that suggest?
        options:
          - {text: "It has fewer rounds to combine the clues that settle the pronoun", correct: true, why_right: "Depth is what lets clues be combined step by step."}
          - {text: "Its tokenizer split the pronoun wrongly", correct: false, why_wrong: "Pronouns are short, common tokens; the problem is combining clues."}
          - {text: "Its layers were programmed without a pronoun rule", correct: false, why_wrong: "Nobody programs such rules; layers learn what they do."}
      - id: layers-recap
        type: recap
        text: A layer is attention plus a per-token refinement; stacking many layers builds meaning from combined clues.
        sums_up: [layers-idea, pipeline-layers]

  # ---------------------------------------------------------------- 5
  - id: next-token
    title: The next token is a probability
    minutes: 12
    beat: [mechanism]
    milestone: "I can predict how temperature changes the next-token pick."
    open_question: "If a reply is just likely tokens, what happens when no likely answer exists?"
    why_it_matters: Every reply is built one token at a time from odds. That explains why answers vary, and what temperature really changes.
    must_know:
      - The model gives odds to every token for the next position, picks one, adds it, and repeats.
      - Temperature sharpens or flattens those odds; it adds no knowledge.
    must_get_right:
      - id: read-temperature
        can_do: Predict how lowering or raising the temperature changes the pick.
        evidence: The learner picks the effect; each wrong pick shows the real odds.
        objective: predict-sampling
        tested_by: [temperature-blank, sampling-key-check]
      - id: not-lookup
        can_do: Explain why the same prompt can give different replies.
        evidence: A pitfall check in a new case.
        objective: predict-sampling
        tested_by: [lookup-check]
    brings_in: [refined-meaning, tokens-are-numbers]
    carries_forward:
      - id: one-token-at-a-time
        idea: A reply is built one token at a time, each picked from odds over every token, shaped by temperature.
        used_in: [training-and-limits]
        shown_by: [odds-idea, odds-bars]
    misconceptions: [looks-up-answer, temperature-is-intelligence]
    bridge_in:
      text: After the last layer, the final token's embedding holds a refined meaning of everything before it. The model still has to turn that into one of its token numbers.
      recalls: [refined-meaning, tokens-are-numbers]
    bridge_out:
      text: Last, where the odds come from in training, and the limits that training leaves, such as hallucination and the context window.
      points_to: training-and-limits
    blocks:
      - id: predict-same-prompt
        type: predict
        question: You send the same prompt twice and get two different replies. Is something broken?
        options:
          - {text: "Yes, a model should always give the same answer", correct: false, why_wrong: "Variety is built in: each token is picked from odds."}
          - {text: "No, each token is picked from odds, so picks can differ", correct: true, why_right: "Two runs can take different paths from the same odds."}
      - id: odds-idea
        type: idea
        key: true
        text: "The model turns its last embedding into odds for every token in the list, picks one, adds it, and runs again for the next. Temperature reshapes the odds first: low makes the top token win almost always, high gives the others more chance."
        more: "The last layer's embedding for the final position becomes a score for every token, and the scores become odds that add up to 1. As temperature gets close to 0, the model always takes the top token. The odds below come from the toy model's made-up scores for the word after \"The bank by the river was\"."
      - id: odds-bars
        type: diagram
        shape: change-over-time
        brief:
          understand: The odds are one strip shared out between words; a draw lands somewhere on it, and temperature only reshapes the slices.
          how_it_helps: "A strip split into one slice per word, a dot that drops onto it, and bins that fill as you draw 10 or 100 words."
          clearer_than_text: Seeing draws pile up in proportion to slice width, while the slider reshapes the slices and no new word appears.
        motion:
          changes: The width of each word's slice as the temperature moves, and where each draw lands.
          stays: The five words, their order, and the strip's full width, which always stands for all the odds.
          why_not_still: A still picture shows the odds, but not that a reply is a draw that can land in any slice, nor how draws pile up in proportion to width.
          learner_does: run
          breaks: looks-up-answer
        figure:
          kind: scene
          toy: true
          height: 250
          steps:
            - label: The strip
              caption: All the odds form one strip. Each word owns a slice as wide as its chance.
            - label: One draw
              caption: A random point lands on the strip, and the word whose slice it hits becomes the next token.
            - label: Many draws
              caption: Press Draw 100. Each draw lands in a slice, and the bars fill toward the marks that show each word's share.
          controls:
            - {id: temperature, kind: slider, label: Temperature, values: ["0.2", "0.7", "1.0", "1.5"], start: 2}
            - {id: draw, kind: run, label: Draw, trials: [10, 100], unit: words}
          computed_by:
            language: python
            code: |
              import json, random
              from toy_llm import NEXT_SCORES, softmax
              temperatures = ["0.2", "0.7", "1.0", "1.5"]
              odds = {t: [round(share, 4) for share in softmax(list(NEXT_SCORES.values()), float(t))] for t in temperatures}
              # One example draw, low enough on the strip to land in the top word's slice at every temperature
              example_draw = round(random.Random(7).random() * 0.4, 3)
              print(json.dumps({"data": {"words": list(NEXT_SCORES), "temperatures": temperatures, "odds": odds, "example_draw": example_draw}}))
          data:
            words:
              - flooded
              - closed
              - muddy
              - open
              - robbed
            temperatures:
              - '0.2'
              - '0.7'
              - '1.0'
              - '1.5'
            odds:
              '0.2':
                - 0.9972
                - 0.0025
                - 0.0003
                - 0.0
                - 0.0
              '0.7':
                - 0.7445
                - 0.1341
                - 0.0757
                - 0.0321
                - 0.0136
              '1.0':
                - 0.5971
                - 0.1798
                - 0.1206
                - 0.0662
                - 0.0363
              '1.5':
                - 0.459
                - 0.2062
                - 0.158
                - 0.1059
                - 0.071
            example_draw: 0.13
          script: |
            // Layout: the strip on top, then one row per word with its share and a bin that fills with draws
            const words = scene.data.words, temperatures = scene.data.temperatures;
            const left = 20, right = 320, stripTop = 46, stripHeight = 34;
            const rowsTop = 136, rowGap = 22, binLeft = 150, binWidth = 165;
            const oddsAt = (settings) => scene.data.odds[temperatures[settings.temperature]];
            // Which slice a point from 0 to 1 lands in
            const sliceAt = (point, shares) => { let edge = 0; for (let i = 0; i < shares.length; i += 1) { edge += shares[i]; if (point < edge) return i; } return shares.length - 1; };

            // The strip: one slice per word; a label only where the slice is wide enough to hold it
            scene.add("text", { x: left, y: stripTop - 10, class: "svg-text small" }, "All the odds, as one strip");
            const slices = words.map((word, i) => scene.add("rect", { x: left, y: stripTop, width: 0, height: stripHeight, class: i === 0 ? "svg-box hot" : "svg-box" }));
            const sliceLabels = words.map((word) => scene.add("text", { x: left, y: stripTop + 21, "text-anchor": "middle", class: "svg-text small", opacity: 0 }, word));
            // The draw: a dot that drops onto the strip
            const dot = scene.add("circle", { cx: left + (right - left) * scene.data.example_draw, cy: 14, r: 6, class: "svg-dot hot", opacity: 0 });

            // One row per word: its name, its share, a bin for draws, and a mark where its share says draws should reach
            const names = words.map((word, i) => scene.add("text", { x: left, y: rowsTop + i * rowGap, class: "svg-text" }, word));
            const shareTexts = words.map((word, i) => scene.add("text", { x: 130, y: rowsTop + i * rowGap, "text-anchor": "end", class: "svg-text small" }, ""));
            const bins = words.map((word, i) => scene.add("rect", { x: binLeft, y: rowsTop + i * rowGap - 11, width: 0, height: 12, class: "svg-bar" }));
            const marks = words.map((word, i) => scene.add("line", { x1: binLeft, x2: binLeft, y1: rowsTop + i * rowGap - 14, y2: rowsTop + i * rowGap + 4, class: "svg-line hot", opacity: 0 }));

            scene.show = (step, from, settings) => {
              const shares = oddsAt(settings);
              // The slices take their widths at this temperature; no word appears or disappears
              let x = left;
              shares.forEach((share, i) => {
                const width = (right - left) * share;
                scene.move(slices[i], { x, width });
                scene.move(sliceLabels[i], { x: x + width / 2, opacity: width >= 48 ? 1 : 0 });
                scene.write(shareTexts[i], `${Math.round(share * 100)}%`);
                x += width;
              });
              // Step 2: one draw lands in a slice, and that word lights up
              const hit = sliceAt(scene.data.example_draw, shares);
              scene.move(dot, { cy: step >= 1 ? stripTop + stripHeight / 2 : 14, opacity: step >= 1 ? 1 : 0 });
              names.forEach((name, i) => name.setAttribute("class", step >= 1 && i === hit ? "svg-text hot" : "svg-text"));
              // Step 3: the marks show where many draws should pile up; the bins empty for a fresh run
              marks.forEach((mark, i) => { const at = binLeft + binWidth * shares[i]; scene.move(mark, { x1: at, x2: at, opacity: step >= 2 ? 1 : 0 }); });
              bins.forEach((bin) => scene.move(bin, { width: 0 }, { duration: 300 }));
            };

            // Draw words: each draw is a random point on the strip; the bins fill with the share each word got
            scene.run = (trials, settings) => {
              const shares = oddsAt(settings);
              const counts = words.map(() => 0);
              for (let t = 0; t < trials; t += 1) counts[sliceAt(scene.random(), shares)] += 1;
              counts.forEach((count, i) => scene.move(bins[i], { width: binWidth * count / trials }, { delay: i * 120 }));
              return words.map((word, i) => `${word} ${counts[i]}`).join(" · ") + ` (of ${trials} draws)`;
            };
      - id: pipeline-next
        type: diagram
        shape: flow
        brief:
          understand: The odds and the pick close the loop, because the picked token goes back in as the next input.
          how_it_helps: "The chapter 4 pipeline with two new boxes: odds for every token, then pick one, with an arrow back up to tokens."
          clearer_than_text: The arrow back to tokens shows that a reply is the whole pipeline run once per token.
        figure:
          kind: flow
          parts:
            - {id: odds, label: Odds, note: for every token, row: 5}
            - {id: pick, label: Pick one, note: shaped by temperature, row: 5}
          links:
            - {from: refine, to: odds}
            - {from: odds, to: pick}
            - {from: pick, to: tokens, label: add + repeat}
        extends:
          diagram: pipeline-layers
          adds: "odds for every token and the pick. The picked token goes back in, and the whole pipeline runs again."
      - id: run-by-run
        type: diagram
        shape: change-over-time
        brief:
          understand: Each run reads every token so far, then one new token travels back and joins the end of the text.
          how_it_helps: "Tokens in a row above the model; each run sends every token along its own curve into the model, and the new one rides a curve back."
          clearer_than_text: Watching all the tokens travel again on the second run shows that nothing is written ahead; each run starts from the whole text.
        motion:
          changes: The tokens that travel into the model on each run, and the new token that travels back to the end of the row.
          stays: The model in the middle, and every token already in the row, which never moves.
          why_not_still: A still picture of the loop shows an arrow back, but not that every token is read again on every run, in order, before one new token joins.
          learner_does: step
          breaks: looks-up-answer
        figure:
          kind: scene
          library: anime
          height: 230
          steps:
            - label: Text so far
              caption: Six tokens wait in a row above the model. The model reads only these.
            - label: Run 1
              caption: Every token travels into the model, and one new token, flooded, travels back to the end of the row.
            - label: Run 2
              caption: The next run reads all seven tokens again, flooded included, and adds one more.
          computed_by:
            language: python
            code: |
              import json
              from toy_llm import RIVER
              # The prompt the lesson follows, and the two tokens the next runs add
              print(json.dumps({"data": {"prompt": RIVER[:6], "next": [RIVER[6], "."]}}))
          data:
            prompt:
              - The
              - bank
              - by
              - the
              - river
              - was
            next:
              - flooded
              - .
          script: |
            // Layout: the text so far in a row at the top, the model below; each run reads every token and adds one
            const { createTimeline, svg } = scene.anime;
            const prompt = scene.data.prompt, next = scene.data.next;
            const rowY = 32, model = { x: 120, y: 160, w: 100, h: 40 };
            const chipWidth = (word) => Math.max(26, word.length * 6.6 + 12);
            const centres = (words) => { const out = []; let x = 8; for (const w of words) { out.push(x + chipWidth(w) / 2); x += chipWidth(w) + 4; } return out; };
            // A chip is drawn around (0, 0) inside a group, so it can travel by translate
            function chip(word, isNew) {
              const group = scene.add("g", {});
              const width = chipWidth(word);
              group.append(scene.add("rect", { x: -width / 2, y: -11, width, height: 22, rx: 5, class: isNew ? "svg-box hot" : "svg-box" }));
              group.append(scene.add("text", { x: 0, y: 4, "text-anchor": "middle", class: "svg-text small" }, word));
              return group;
            }

            scene.show = (step) => {
              // The state after this step: the row holds the prompt plus one token per run so far
              scene.root.replaceChildren();
              scene.add("text", { x: 8, y: 12, class: "svg-text small" }, "Text so far");
              scene.add("rect", { x: model.x, y: model.y, width: model.w, height: model.h, rx: 8, class: "svg-box" });
              scene.add("text", { x: model.x + model.w / 2, y: model.y + 25, "text-anchor": "middle", class: "svg-text" }, "Model");
              const words = prompt.concat(next.slice(0, step));
              const read = words.slice(0, words.length - (step ? 1 : 0));
              const xs = centres(words);
              const target = { x: model.x + model.w / 2, y: model.y };
              const routes = step ? read.map((word, i) => scene.add("path", { d: `M ${xs[i]} ${rowY + 11} C ${xs[i]} ${rowY + 80}, ${target.x} ${target.y - 70}, ${target.x} ${target.y}`, class: "svg-line dim" })) : [];
              const chips = words.map((word, i) => scene.set(chip(word, step > 0 && i === words.length - 1), { transform: `translate(${xs[i]} ${rowY})` }));
              if (!step) return;
              // The last run, hidden until it plays: each token read travels its own curve in, then the new token rides back
              const end = { x: xs[xs.length - 1], y: rowY };
              const back = scene.add("path", { d: `M ${model.x + model.w} ${model.y + model.h / 2} C 330 ${model.y + model.h / 2}, ${end.x + 30} ${end.y + 70}, ${end.x} ${end.y}`, class: "svg-line hot", opacity: 0 });
              const dots = read.map(() => scene.add("circle", { cx: 0, cy: 0, r: 4, class: "svg-dot hot", opacity: 0 }));
              const newChip = scene.set(chips[chips.length - 1], { opacity: 0 });
              scene.root.append(newChip);
              // --- motion (anime.js) ---
              const timeline = createTimeline({ autoplay: false, defaults: { ease: "inOutQuad" } });
              dots.forEach((dot, i) => {
                const { translateX, translateY } = svg.createMotionPath(routes[i]);
                timeline.set(dot, { opacity: 1 }, i * 70);
                timeline.add(dot, { translateX, translateY, duration: 700 }, i * 70);
                timeline.add(dot, { opacity: 0, duration: 100 }, i * 70 + 600);
              });
              const way = svg.createMotionPath(back);
              timeline.set(back, { opacity: 1 }, "+=200");
              timeline.add(svg.createDrawable(back), { draw: ["0 0", "0 1"], duration: 900 }, "<<");
              timeline.set(newChip, { opacity: 1 }, "<<");
              timeline.add(newChip, { translateX: way.translateX, translateY: way.translateY, duration: 900 }, "<<");
              scene.play(timeline);
              // --- end motion ---
            };
      - id: temperature-blank
        type: fill_blanks
        instructions:
          - Fill the blank using the temperature slider and the strip.
        language: text
        source: the toy next-token odds
        context_note: The odds for the word after "The bank by the river was".
        text: "Turning the temperature down from 1.0 to 0.2 makes flooded {{effect}}."
        blanks:
          - id: effect
            options:
              - text: almost certain to be picked
                correct: true
                why_right: Low temperature sharpens the odds, so the top token takes nearly all of them.
                output: "Flooded's chance goes from 0.60 at temperature 1.0 to 1.00 at 0.2 (rounded)."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
              - text: less likely, because the model is less confident
                correct: false
                why_wrong: Low temperature makes the top token more likely, not less.
                misconception: temperature-is-intelligence
                output: "The opposite happens: flooded rises from 0.60 to 1.00. At 1.5 it falls to 0.46."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
              - text: smarter, so it picks a better word than flooded
                correct: false
                why_wrong: Temperature only reshapes the same odds; no new or better word appears.
                misconception: temperature-is-intelligence
                output: "The same 5 words keep the same order at every temperature; only their shares change."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
        hints:
          - Slide to 0.2 and read flooded's share.
      - id: sampling-key-check
        type: check
        purpose: key
        tests: odds-idea
        question: You want a classifier prompt to give the same label every time it sees the same text. What setting helps most?
        options:
          - {text: "A temperature near 0, so the top token is nearly always picked", correct: true, why_right: "Sharp odds mean the same pick on every run."}
          - {text: "A high temperature, so the model thinks harder", correct: false, why_wrong: "High temperature spreads the odds and adds variety, not thought."}
          - {text: "A longer reply, so the label is checked twice", correct: false, why_wrong: "Each extra token is another pick from odds; length adds no consistency."}
      - id: temperature-pitfall
        type: pitfall
        misconception: temperature-is-intelligence
      - id: lookup-check
        type: check
        purpose: pitfall
        tests: looks-up-answer
        question: "A teammate says: the model found the answer in its memory, so asking again should give the same words. What is wrong with that?"
        options:
          - {text: "Replies are built token by token from odds, so a new run can differ", correct: true, why_right: "There is no stored answer; each pick is a draw from odds."}
          - {text: "Nothing; the same question should give the same words", correct: false, why_wrong: "Only a temperature near 0 makes repeat runs nearly identical."}
          - {text: "The model forgets everything after each word", correct: false, why_wrong: "It sees all earlier tokens in the window; the variety comes from the pick."}
      - id: lookup-pitfall
        type: pitfall
        misconception: looks-up-answer
      - id: next-recap
        type: recap
        text: A reply is built one token at a time from odds over every token; temperature reshapes the odds but adds no knowledge.
        sums_up: [odds-idea, odds-bars]

  # ---------------------------------------------------------------- 6
  - id: training-and-limits
    title: Training, and the limits it leaves
    minutes: 10
    beat: [boundary, payoff]
    milestone: "I can explain where hallucinations and the context limit come from."
    why_it_matters: The model's strengths and its two best-known limits, hallucination and the context window, both follow from how it is trained and run.
    must_know:
      - Pretraining teaches next-token prediction on huge text; fine-tuning and RLHF shape it into an assistant.
      - A hallucination is a fluent guess where no pattern gives the answer; the model sees only its context window.
    must_get_right:
      - id: explain-hallucination
        can_do: Predict when a model is likely to hallucinate, and why.
        evidence: The learner fills the blank; each wrong pick shows what really happens.
        objective: explain-limits
        tested_by: [rare-fact-blank, training-key-check]
      - id: explain-window
        can_do: Explain why a model cannot use text outside its context window.
        evidence: The grader checks the answer names the window as all the model can see.
        objective: explain-limits
        tested_by: [explain-window-answer]
    brings_in: [one-token-at-a-time, known-training]
    carries_forward:
      - id: limits-from-training
        idea: Hallucination and the context window follow from next-token prediction, so check facts and put what the model needs into its window.
        used_in: [beyond]
        shown_by: [training-idea, limits-idea]
    misconceptions: [hallucination-is-database-error, model-remembers-chats]
    bridge_in:
      text: A reply is built one token at a time from odds. Training, which adjusts the model's numbers to lower its error, is where those odds come from.
      recalls: [one-token-at-a-time, known-training]
    bridge_out:
      text: "With this picture, you can reason about any model's behaviour: why a RAG prompt helps, why answers vary, and when to double-check."
      points_to: beyond
    blocks:
      - id: predict-birthday
        type: predict
        question: You ask a model for the birthday of a little-known local author. It has no reliable source in its training. What does it most likely do?
        options:
          - {text: "Says politely that it does not know", correct: false, why_wrong: "Training to predict likely text, and tests that reward right answers, both push it to guess."}
          - {text: "Gives a plausible, confident date", correct: true, why_right: "A likely-looking date is exactly what next-token prediction produces."}
      - id: training-idea
        type: idea
        key: true
        text: "Pretraining adjusts the model's numbers to predict each next token in huge amounts of text. Fine-tuning on example answers, then RLHF (people rank replies and the model is trained toward the preferred ones), turn that predictor into an assistant."
        more: "InstructGPT, trained this way, was preferred to a model more than 100 times larger. Most knowledge comes from pretraining. Fine-tuning and RLHF mostly shape behaviour: following instructions, tone, refusing."
      - id: limits-idea
        type: idea
        text: "A hallucination is next-token prediction with no pattern to follow, so a rare fact like a birthday becomes a fluent guess. The context window is all the text the model can see at once: anything outside it, even earlier chats, does not exist for it."
        more: "The context window is the model's working memory: text outside it exists for the model only if it is put back in."
      - id: training-flow
        type: diagram
        shape: flow
        brief:
          understand: Knowledge comes in at pretraining, and the later stages shape behaviour.
          how_it_helps: "Five boxes top to bottom: lots of text, pretraining, fine-tuning, RLHF, assistant. Pretraining and RLHF are highlighted."
          clearer_than_text: The order shows that the assistant is a next-token predictor first, which is where hallucination comes from.
        figure:
          kind: flow
          parts:
            - {id: corpus, label: Lots of text, row: 0}
            - {id: pretrain, label: Pretraining, note: predict the next token, row: 1}
            - {id: finetune, label: Fine-tuning, note: example answers, row: 2}
            - {id: rlhf, label: RLHF, note: people rank replies, row: 3}
            - {id: assistant, label: Assistant, row: 4}
          links:
            - {from: corpus, to: pretrain}
            - {from: pretrain, to: finetune}
            - {from: finetune, to: rlhf}
            - {from: rlhf, to: assistant}
          highlight: [pretrain, rlhf]
      - id: rare-fact-blank
        type: fill_blanks
        instructions:
          - Fill the blank with what a model most likely does with a rare fact it never learned.
        language: text
        source: the birthday question above
        context_note: A little-known author's birthday, with no reliable source in training.
        text: "Asked for the birthday of a little-known author, a model most likely {{act}}."
        blanks:
          - id: act
            options:
              - text: writes a plausible, confident date
                correct: true
                why_right: A rare fact has no pattern to predict from, so the model writes a likely-looking guess.
                output: "Rare facts like a birthday cannot be predicted from patterns alone, so the model produces a fluent guess."
                output_from: source
                output_source: "OpenAI (2025), Why language models hallucinate"
              - text: looks it up in its database and finds an error
                correct: false
                why_wrong: There is no database; the reply is predicted token by token.
                misconception: hallucination-is-database-error
                output: "There is nothing to look up. The date is predicted text, which is why it can look right and be wrong."
                output_from: source
                output_source: "OpenAI (2025), Why language models hallucinate"
              - text: remembers asking you last week and repeats your answer
                correct: false
                why_wrong: It sees only its context window, not earlier chats.
                misconception: model-remembers-chats
                output: "Last week's chat is outside the context window, so the model cannot see it unless an app puts it back in."
                output_from: source
                output_source: "Claude docs, Context windows"
        hints:
          - Is there any pattern in text that would predict this one author's birthday?
      - id: database-pitfall
        type: pitfall
        misconception: hallucination-is-database-error
      - id: explain-window-answer
        type: explain
        instructions:
          - "In two sentences, explain to a teammate why a model 'forgot' the instructions given at the very start of a very long chat."
        reference_solution: The model sees only what is in its context window, its working memory, and a very long chat can push the early instructions out, or leave them as a small share of what attention weighs. Nothing is stored between turns except the text in the window, so put key instructions back in, or keep them in the system prompt.
        rubric:
          - {criterion: "Names the window", passing: "Says the model sees only the text in its context window."}
          - {criterion: "Gives a fix", passing: "Says to restate the instructions, shorten the chat, or keep them in the system prompt."}
        hints:
          - Where does the model keep anything between turns?
        common_wrong_answers:
          - {answer: "It got tired of following them.", misconception: model-remembers-chats, hint: "What can the model see right now?"}
      - id: remembers-pitfall
        type: pitfall
        misconception: model-remembers-chats
      - id: training-key-check
        type: check
        purpose: key
        tests: training-idea
        question: A model gives a fluent but wrong answer about a niche product launched after its training data was collected. Which fix goes after the cause?
        options:
          - {text: "Put the product's real docs in its context, as RAG does", correct: true, why_right: "The fact was never in pretraining, so it has to come in through the window."}
          - {text: "Tell it in the prompt to try much harder", correct: false, why_wrong: "Effort cannot predict a fact the model never saw."}
          - {text: "Raise the temperature so it explores more", correct: false, why_wrong: "Temperature reshapes the same odds; it adds no knowledge."}
      - id: limits-recap
        type: recap
        text: Pretraining teaches next-token prediction, so rare facts become fluent guesses; the model sees only its context window.
        sums_up: [training-idea, limits-idea]
