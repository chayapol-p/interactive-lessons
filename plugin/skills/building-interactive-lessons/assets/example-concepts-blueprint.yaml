                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
              - text: nowhere, its meaning is fixed
                correct: false
                why_wrong: The embedding is only the start; attention moves it.
                misconception: one-fixed-meaning
                output: "Bank starts at water 0.50, money 0.50, and leaves attention at water 0.75, money 0.14. It moved."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
