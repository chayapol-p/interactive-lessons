                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
          - id: side
            options:
              - text: water
                correct: true
                why_right: River and flooded are about water, so blending them in moves bank toward water.
                output: "Bank gives river 0.43 and flooded 0.20 of its attention, so its point moves to water 0.75, money 0.14."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
