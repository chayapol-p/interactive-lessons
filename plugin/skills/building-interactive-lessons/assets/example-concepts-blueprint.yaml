      - id: bank-attends
        type: fill_blanks
        instructions:
          - Fill both blanks for the river sentence, using the attention grid.
        language: text
        source: the toy attention grid
        context_note: The river sentence from the grid above.
        text: "In \"The bank by the river was flooded\", bank gives its biggest share of attention to {{word}}, so its meaning moves toward {{side}}."
        blanks:
          - id: word
            options:
              - text: river
                correct: true
                why_right: River gets the biggest share after bank itself, because their meanings overlap most.
                output: "Bank gives river 0.43 and flooded 0.20 of its attention, so its point moves to water 0.75, money 0.14."
                output_from: worked
                output_source: worked out with the toy model behind this chapter's pictures
              - text: the, right before it
                correct: false
                why_wrong: Attention goes by relevance, not distance; the gets almost nothing.
                misconception: nearest-word-matters-most
