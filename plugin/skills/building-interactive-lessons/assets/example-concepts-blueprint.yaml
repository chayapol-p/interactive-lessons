        objective: explain-context
        tested_by: [bank-attends, attention-key-check]
      - id: not-nearest
        can_do: Explain why attention is not about the nearest word.
        evidence: A pitfall check in a new sentence.
        objective: explain-context
        tested_by: [nearest-check]
    brings_in: [embedding-is-start]
    carries_forward:
      - id: meaning-in-context
        idea: After attention, each token's embedding reflects its context, so bank ends near water in one sentence and near money in the other.
        used_in: [layers, next-token]
        shown_by: [attention-idea, attention-grid, bank-moves]
    misconceptions: [one-fixed-meaning, nearest-word-matters-most]
    bridge_in:
      text: Every token now has an embedding, a fixed starting point that is the same in every sentence. Bank sits halfway between water and money.
