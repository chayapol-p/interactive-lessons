# Example with no code: How LLMs Work, by intuition. One sentence followed from text to the next token.
# Text blanks, token chips, a word map, an attention grid and a temperature slider; every number is computed.

lesson:
  title: How LLMs Work
  big_idea: "An LLM turns text into numbers, lets every word reshape the others' meaning, and writes its reply one likely token at a time."
  role: standalone
  learner:
    knows: ["RAG in practice: chunks, embeddings as vectors, vector search", "building with LLMs: prompts, tool calls, agent loops, context limits", "ML basics: training lowers a model's error", vector maths]
    new_to: what happens inside an LLM between the prompt and the reply
    wants_to: build an intuition for how LLMs work, to reason about their behaviour and limits
    time_minutes: 60
    assumed: false
  objectives:
    - id: predict-tokens
      text: After this, you can predict how a model splits text into tokens, and why that makes spelling and some languages harder.
    - id: explain-context
      text: After this, you can explain how attention lets a word's meaning change with the words around it.
    - id: predict-sampling
      text: After this, you can predict how temperature changes which next token a model picks.
    - id: explain-limits
      text: After this, you can explain why a model can hallucinate, and why it cannot see text outside its context window.
  agreed_extras: [scene]
  source: "Vaswani et al. 2017; Mikolov et al. 2013; Ouyang et al. 2022; OpenAI 2025; Hugging Face text-generation guide; Claude context-window docs; a real tokenizer run"

theme:
  name: Circuit violet
  accent: "#5b3cc4"
  why: A violet from the world of chips and circuits, drafted for this AI lesson; confirm or change it.

glossary:
  - term: token
    definition: A piece of text the model reads as one unit, such as a word, part of a word or a punctuation mark. Each token has a number.
  - term: embedding
    definition: A list of numbers that places a token as a point in a space of meaning; nearby points mean similar things.
  - term: attention
    definition: The step where each token looks at the other tokens and blends in what it needs from them.
  - term: layer
    definition: One round of attention followed by a small per-token refinement. A model stacks many.
  - term: temperature
    definition: A setting that sharpens or flattens the model's odds before it picks the next token.
  - term: context window
    definition: All the text a model can see at once, including its own reply. Its working memory.
  - term: pretraining
    definition: Training on huge amounts of text to predict the next token.
  - term: fine-tuning
    definition: Further training on example answers, so the model follows instructions.
  - term: RLHF
    definition: Reinforcement learning from human feedback; people rank answers, and the model is trained toward the preferred ones.
  - term: hallucination
    definition: A fluent, confident statement that is false.

known_ideas:
  - id: known-rag-embeddings
    idea: In RAG, an embedding model turns each chunk into a vector, and nearby vectors mean similar text.
  - id: known-prompting
    idea: You send a prompt, and the model writes a reply within a context limit.
  - id: known-training
    idea: A model learns by adjusting its numbers to lower its error on training examples.

facts:
  - id: fact-tokenizer-run
    statement: "A real tokenizer splits 'The bank by the river was flooded.' into 8 tokens, gives ' bank' the number 5657 in both example sentences, and splits 'strawberry' into st, raw, berry."
    status: confirmed
    source: the tokenizer bundled with the Anthropic Python SDK 0.25.0 (65,000 tokens), run for this lesson
  - id: fact-tokenizer-old
    statement: That tokenizer was built for older Claude models; current models use their own tokenizers, so exact splits and numbers differ.
    status: inferred
    source: written for this lesson
  - id: fact-thai-bytes
    statement: "The same tokenizer needs 2 tokens for 'Bangkok' and 14 tokens for its Thai name 'กรุงเทพ' (7 characters)."
    status: confirmed
    source: the same tokenizer run
  - id: fact-word-vectors
    statement: "In learned word vectors, 'King − Man + Woman' lands very close to 'Queen'."
    status: confirmed
    source: "Mikolov, Yih and Zweig (2013), Linguistic Regularities in Continuous Space Word Representations, NAACL"
  - id: fact-self-attention
    statement: Self-attention relates different positions of a single sequence; the Transformer is based solely on attention, without recurrence.
    status: confirmed
    source: "Vaswani et al. (2017), Attention Is All You Need, abstract and section 2"
  - id: fact-six-layers
    statement: The original Transformer stacks 6 identical layers, and generates one token at a time, feeding each output back in.
    status: confirmed
    source: "Vaswani et al. (2017), sections 3 and 3.1"
  - id: fact-temperature
    statement: Lowering the temperature makes the distribution sharper; as it approaches 0, sampling becomes greedy decoding.
    status: confirmed
    source: Hugging Face blog, How to generate text
  - id: fact-rlhf-steps
    statement: "InstructGPT was trained in 3 steps: supervised fine-tuning on demonstrations, a reward model from ranked comparisons, then reinforcement learning (PPO); its 1.3B model was preferred to the 175B GPT-3."
    status: confirmed
    source: "Ouyang et al. (2022), Training language models to follow instructions with human feedback, sections 1 and 3.1"
  - id: fact-hallucination
    statement: Arbitrary low-frequency facts, like a pet's birthday, cannot be predicted from patterns alone, and grading only accuracy encourages guessing.
    status: confirmed
    source: "OpenAI (5 Sep 2025), Why language models hallucinate"
  - id: fact-context-window
    statement: The context window is all the text a model can reference when generating a response, including the response itself; a working memory, separate from training data.
    status: confirmed
    source: "Claude docs, Context windows"
  - id: fact-toy-model
    statement: The word map, the attention grid and the next-token odds come from a toy model with 3 made-up meaning directions; real models learn thousands of numbers per token, so real values differ.
    status: inferred
    source: written for this lesson (toy_llm)

misconceptions:
  - id: reads-letters
    wrong_idea: The model reads text letter by letter, or word by word, like we do.
    why_people_believe_it: The reply comes back as normal text, so it feels like the model saw normal text.
    what_is_true: It receives a list of token numbers. A word can be several tokens, and the letters inside a token are not visible to it.
    source: the tokenizer run (strawberry is st, raw, berry)
  - id: same-cost-every-language
    wrong_idea: Every language costs about the same number of tokens per word.
    why_people_believe_it: A word is a word, whatever the language.
    what_is_true: Tokenizers learn common pieces from their training text. Languages it saw less, such as Thai here, split into many more tokens, which costs more and fills the context window faster.
    source: the tokenizer run (Bangkok 2 tokens, กรุงเทพ 14)
  - id: number-is-meaning
    wrong_idea: A token's number carries its meaning, so nearby numbers mean similar things.
    why_people_believe_it: Numbers next to each other feel related.
    what_is_true: The number is only a row in a table. The meaning lives in the embedding that row holds.
    source: inferred from how embedding tables work
  - id: looks-alike-means-alike
    wrong_idea: Words that are spelled alike sit close together in the embedding space.
    why_people_believe_it: Search engines often match on spelling.
    what_is_true: Positions are learned from how words are used, so 'loan' sits near 'money', not near 'loam'.
    source: "inferred; consistent with Mikolov et al. (2013)"
  - id: one-fixed-meaning
    wrong_idea: Each token has one fixed meaning inside the model.
    why_people_believe_it: A dictionary gives a word one entry.
    what_is_true: The embedding is only the starting point. Attention moves it, so 'bank' ends up near water in one sentence and near money in another.
    source: inferred from self-attention (Vaswani et al. 2017)
  - id: nearest-word-matters-most
    wrong_idea: A word is mostly shaped by the word right next to it.
    why_people_believe_it: Older models read text in order, one word after another.
    what_is_true: Attention lets each token look at every other token in the window at once, weighted by relevance, not distance.
    source: "Vaswani et al. (2017), section 2"
  - id: layers-are-programmed
    wrong_idea: Engineers program what each layer does.
    why_people_believe_it: Software is normally written step by step.
    what_is_true: Engineers set the shape (how many layers, how big). What each layer does is learned in training; researchers study it afterwards.
    source: inferred
  - id: looks-up-answer
    wrong_idea: The model looks up the right answer and then writes it out.
    why_people_believe_it: Replies sound like retrieved facts.
    what_is_true: It writes one token at a time, each picked from odds over every token, so the same prompt can give different replies.
    source: "Vaswani et al. (2017), section 3; Hugging Face, How to generate text"
  - id: temperature-is-intelligence
    wrong_idea: A higher temperature makes the model smarter or more knowledgeable.
    why_people_believe_it: Higher temperature is sold as more creative.
    what_is_true: Temperature only reshapes the same odds. It adds variety, not knowledge; low temperature makes the top token win more often.
    source: Hugging Face blog, How to generate text
  - id: hallucination-is-database-error
    wrong_idea: A hallucination is a wrong entry in the model's database.
    why_people_believe_it: We picture the model as a search engine over facts.
    what_is_true: There is no database. The model predicts likely text, and a rare fact has no pattern to predict from, so it guesses fluently.
    source: "OpenAI (2025), Why language models hallucinate"
  - id: model-remembers-chats
    wrong_idea: The model remembers your earlier chats and learns from each conversation.
    why_people_believe_it: A long chat feels like talking to someone who remembers.
    what_is_true: It sees only what is in its context window right now. Chatting does not change its trained numbers; apps that remember do it by putting saved notes back into the window.
    source: "Claude docs, Context windows; the rest inferred"

shared_modules:
  toy_llm: |
    """A toy model for the lesson's pictures. The vectors and scores are made up to show the idea; a real model
    learns thousands of numbers per token. Every number in the pictures is computed from these."""
    import math

    # Each word's toy meaning along 3 named directions: about water, about money, about a place
    MEANING = {
        "The": [0.0, 0.0, 0.1], "bank": [0.5, 0.5, 0.2], "by": [0.0, 0.0, 0.3], "the": [0.0, 0.0, 0.1],
        "river": [1.0, 0.0, 0.6], "was": [0.0, 0.0, 0.0], "flooded": [0.9, 0.0, 0.1],
        "raised": [0.0, 0.6, 0.0], "its": [0.0, 0.0, 0.0], "interest": [0.0, 1.0, 0.0], "rate": [0.0, 0.8, 0.0],
        "water": [0.8, 0.2, 0.2], "boat": [0.65, 0.1, 0.3], "money": [0.15, 1.0, 0.1], "loan": [0.1, 0.9, 0.0],
    }
    RIVER = ["The", "bank", "by", "the", "river", "was", "flooded"]
    MONEY = ["The", "bank", "raised", "its", "interest", "rate"]

    def dot(left, right):
        return sum(a * b for a, b in zip(left, right))

    def softmax(scores, temperature=1.0):
        """Turn scores into chances that add up to 1. Temperature divides the scores first."""
        scaled = [score / temperature for score in scores]
        biggest = max(scaled)
        weights = [math.exp(score - biggest) for score in scaled]
        return [weight / sum(weights) for weight in weights]

    def attention_row(word, words, sharpness=5.0):
        """How much `word` looks at each word: a softmax of how much their meanings overlap."""
        return softmax([sharpness * dot(MEANING[word], MEANING[other]) for other in words])

    def after_attention(word, words):
        """The word's new meaning: every word's meaning blended in, weighted by attention."""
        weights = attention_row(word, words)
        return [sum(weight * MEANING[other][axis] for weight, other in zip(weights, words)) for axis in range(3)]

    # Toy scores for the word after "The bank by the river was"
    NEXT_SCORES = {"flooded": 3.0, "closed": 1.8, "muddy": 1.4, "open": 0.8, "robbed": 0.2}

chapters:

  # ---------------------------------------------------------------- 1
  - id: text-to-tokens
    title: Text becomes tokens
    minutes: 8
    beat: [hook, intuition]
    milestone: "I can predict roughly how a model splits text into tokens."
    open_question: "A token is only a number, so where does its meaning come from?"
    why_it_matters: Everything a model does, it does to tokens. Spelling slips, odd costs and context limits all start here.
    must_know:
      - A model receives a list of token numbers, not letters or words.
      - Common words are one token; rare words and some languages split into many.
    must_get_right:
      - id: count-tokens
        can_do: Predict what the model receives for a sentence, and why letter-level questions are hard.
        evidence: The learner picks what the model receives; each wrong pick shows what the model really gets.
        objective: predict-tokens
        tested_by: [what-model-receives, token-key-check]
      - id: token-cost
        can_do: Spot why the same text can cost more tokens in another language.
        evidence: A pitfall check on a new language case.
        objective: predict-tokens
        tested_by: [cost-check]
    brings_in: [known-prompting]
    carries_forward:
      - id: tokens-are-numbers
        idea: The model receives text as a list of token numbers.
        used_in: [tokens-to-meaning]
        shown_by: [token-idea, real-tokens]
    misconceptions: [reads-letters, same-cost-every-language]
    bridge_in:
      text: You send a prompt and get a reply. Between the two, the prompt is first cut into pieces the model can count.
      recalls: [known-prompting]
    bridge_out:
      text: Next, each token number is swapped for an embedding, a point where meaning becomes distance.
      points_to: tokens-to-meaning
    blocks:
      - id: predict-strawberry
        type: predict
        question: Models often miscount the letter r in "strawberry". What do you think the model actually receives for that word?
        options:
          - {text: "10 letters, one at a time", correct: false, why_wrong: "If it saw letters, counting them would be easy."}
          - {text: "A few pieces of the word, each as a number", correct: true, why_right: "It gets 3 pieces, st, raw and berry, and never sees the letters inside them."}
          - {text: "The whole word as one picture", correct: false, why_wrong: "Text models receive numbers, not images of words."}
      - id: example-idea
        type: idea
        text: "This lesson follows one sentence through a model: \"The bank by the river was flooded.\" A second sentence, \"The bank raised its interest rate.\", uses the same word bank with another meaning. Watch what happens to bank in each."
      - id: token-idea
        type: idea
        key: true
        text: "Before the model sees anything, a tokenizer cuts the text into tokens (common words, parts of rare words, punctuation) and swaps each for its number in a fixed list. Bank gets the same number in both sentences, so nothing yet tells the two meanings apart."
        more: "So the model receives only a list of numbers. The tokenizer used here has 65,000 tokens. It is an older Claude tokenizer, so today's models split text a little differently."
      - id: real-tokens
        type: diagram
        shape: structure
        brief:
          understand: The model receives a list of numbered pieces, and bank gets the same number whatever it means.
          how_it_helps: "Each sentence drawn as chips, one per token, with its number under it; bank is highlighted in both rows. A third row splits strawberry."
          clearer_than_text: Seeing ' bank' as 5657 in both rows shows the meaning problem that later chapters solve.
        figure:
          kind: tokens
          computed_by:
            language: python
            run_locally:
              command: "pip download --no-deps anthropic==0.25.0, unzip tokenizer.json, pip install tokenizers, then run this code"
              why: needs the tokenizer file, which is not part of the lesson
            code: |
              import json
              from tokenizers import Tokenizer
              tokenizer = Tokenizer.from_file("tokenizer.json")   # bundled with anthropic 0.25.0
              rows = []
              for label, text in [("River sentence", "The bank by the river was flooded."),
                                  ("Money sentence", "The bank raised its interest rate."), ("One long word", "strawberry")]:
                  encoded = tokenizer.encode(text)
                  rows.append({"label": label, "tokens": [dict({"text": token.replace("Ġ", " "), "id": number}, **({"hot": True} if token == "Ġbank" else {}))
                                                          for token, number in zip(encoded.tokens, encoded.ids)]})
              print(json.dumps({"rows": rows}))
          rows:
            - label: River sentence
              tokens:
                - {text: "The", id: 773}
                - {text: " bank", id: 5657, hot: true}
                - {text: " by", id: 546}
                - {text: " the", id: 279}
                - {text: " river", id: 10674}
                - {text: " was", id: 504}
                - {text: " flooded", id: 45098}
                - {text: ".", id: 18}
            - label: Money sentence
              tokens:
                - {text: "The", id: 773}
                - {text: " bank", id: 5657, hot: true}
                - {text: " raised", id: 6933}
                - {text: " its", id: 1195}
                - {text: " interest", id: 2952}
                - {text: " rate", id: 3702}
                - {text: ".", id: 18}
            - label: One long word
              tokens:
                - {text: "st", id: 275}
                - {text: "raw", id: 1266}
                - {text: "berry", id: 17574}
      - id: pipeline-tokens
        type: diagram
        shape: flow
        brief:
          understand: Splitting into tokens is the first step of a pipeline this lesson builds one step at a time.
          how_it_helps: "Two boxes: your text, then tokens. Each later chapter adds one step below."
          clearer_than_text: The picture fixes where each later idea sits, so the chapters add up to one machine.
        figure:
          kind: flow
          parts:
            - {id: text, label: Your text, row: 0}
            - {id: tokens, label: Tokens, note: numbered pieces, row: 1}
          links:
            - {from: text, to: tokens, label: split}
          highlight: [tokens]
        grows_in: [tokens-to-meaning, attention, layers, next-token]
      - id: what-model-receives
        type: fill_blanks
        instructions:
          - Fill the blank with what the model receives for the river sentence.
          - See where each choice leads.
        language: text
        source: the river sentence
        context_note: The sentence from the token picture above.
        text: "For \"The bank by the river was flooded.\", the model receives {{unit}}."
        blanks:
          - id: unit
            options:
              - text: 8 token numbers
                correct: true
                why_right: Seven words and the full stop are 8 tokens, each sent as its number.
                output: "8 numbers: 773, 5657, 546, 279, 10674, 504, 45098, 18. Nothing else reaches the model."
                output_from: source
                output_source: the tokenizer bundled with anthropic 0.25.0, run on this sentence
              - text: 34 letters
                correct: false
                why_wrong: The letters never reach the model; it gets the token numbers only.
                misconception: reads-letters
                output: "The letters stay with the tokenizer. The model gets 8 numbers, so counting letters means recalling how each token is spelled."
                output_from: source
                output_source: the tokenizer bundled with anthropic 0.25.0, run on this sentence
              - text: 7 words
                correct: false
                why_wrong: The full stop is a token too, and a rare word would split into several.
                misconception: reads-letters
                output: "8 tokens, not 7 words: the full stop is its own token. A rare word such as strawberry would add 3."
                output_from: source
                output_source: the tokenizer bundled with anthropic 0.25.0, run on this sentence and on strawberry
        hints:
          - Count the chips in the river row of the picture.
      - id: token-key-check
        type: check
        purpose: key
        tests: token-idea
        question: A model is asked to reverse the letters of "unbelievable" and makes a mistake. What is the best explanation?
        options:
          - {text: "It sees a few token pieces, not letters, so it must recall their spelling", correct: true, why_right: "The letters are hidden inside tokens; reversing them takes a memory of spelling, not a look."}
          - {text: "The word is too long to fit in the model's context window", correct: false, why_wrong: "One word is a handful of tokens; the window holds many thousands."}
          - {text: "It was not trained on English", correct: false, why_wrong: "It knows the word well; the problem is that it never sees its letters."}
      - id: letters-pitfall
        type: pitfall
        misconception: reads-letters
      - id: cost-check
        type: check
        purpose: pitfall
        tests: same-cost-every-language
        question: "The same tokenizer needs 2 tokens for \"Bangkok\" and 14 for the city's Thai name. A Thai support bot and an English one answer the same questions. What do you expect?"
        options:
          - {text: "The Thai bot uses many more tokens, so it costs more and fills its window sooner", correct: true, why_right: "Text the tokenizer saw less splits into more pieces, and every piece counts."}
          - {text: "Both cost the same, because the meaning is the same", correct: false, why_wrong: "Cost counts tokens, not meaning."}
          - {text: "The Thai bot is cheaper, because Thai words are shorter", correct: false, why_wrong: "Fewer characters can still mean far more tokens."}
      - id: cost-pitfall
        type: pitfall
        misconception: same-cost-every-language
      - id: tokens-recap
        type: recap
        text: The model receives a list of token numbers; rare words and less-seen languages split into more tokens.
        sums_up: [token-idea, real-tokens]

  # ---------------------------------------------------------------- 2
  - id: tokens-to-meaning
    title: Tokens become points of meaning
    minutes: 10
    beat: [mechanism]
    milestone: "I can place a token as a point in a space of meaning."
    open_question: "Bank is one point in both sentences, so how does it end up meaning river or money?"
    why_it_matters: A token number says nothing by itself. The embedding is where meaning first appears, and every later step works on it.
    must_know:
      - Each token number picks a learned embedding, a point in a space of meaning.
      - Nearby points mean similar things, learned from how words are used.
    must_get_right:
      - id: find-neighbours
        can_do: Predict which words sit near each other in an embedding space.
        evidence: The learner places a word on the map; each wrong place shows what the map really holds.
        objective: explain-context
        tested_by: [place-loan, embedding-key-check]
    brings_in: [tokens-are-numbers, known-rag-embeddings]
    carries_forward:
      - id: embedding-is-start
        idea: Each token starts as an embedding, a fixed point in a space of meaning, the same in every sentence.
        used_in: [attention]
        shown_by: [embedding-idea, meaning-map]
    misconceptions: [number-is-meaning, looks-alike-means-alike]
    bridge_in:
      text: The model now holds a list of token numbers. You have met the next idea in RAG, where vectors place text so that similar text sits close.
      recalls: [tokens-are-numbers, known-rag-embeddings]
    bridge_out:
      text: Next, attention moves each token's embedding using the words around it, which is how bank finds its meaning.
      points_to: attention
    blocks:
      - id: predict-neighbour
        type: predict
        question: Token numbers 5657 and 5658 sit next to each other in the list. Do they mean similar things?
        options:
          - {text: "Yes, nearby numbers mean similar things", correct: false, why_wrong: "The list is ordered by how the tokenizer was built, not by meaning."}
          - {text: "No, the number is only a position in a table", correct: true, why_right: "Meaning lives in the embedding that the number points to."}
      - id: embedding-idea
        type: idea
        key: true
        text: "Each token number picks one row of a large table: the token's embedding, a list of numbers that places it as a point in a space of meaning. Training puts tokens used alike close together, like your RAG embeddings, but for every token."
        more: "In real word vectors, King − Man + Woman lands near Queen, so even directions carry meaning. Real embeddings have hundreds or thousands of numbers. The map below uses only 2 of the toy model's 3 directions, so you can see it."
      - id: meaning-map
        type: diagram
        shape: space
        brief:
          understand: Tokens used alike sit close together, and bank starts halfway between the water words and the money words.
          how_it_helps: "A 2D map: water words on one side, money words on the other, bank highlighted in the middle. A toy sketch."
          clearer_than_text: Bank sitting in the middle shows why one fixed point cannot hold both of its meanings.
        figure:
          kind: scatter
          toy: true
          x_label: about water
          y_label: about money
          highlight: [bank]
          computed_by:
            language: python
            code: |
              import json
              from toy_llm import MEANING
              words = ["river", "water", "boat", "flooded", "money", "loan", "interest", "rate", "bank"]
              print(json.dumps({"points": [{"label": w, "x": MEANING[w][0], "y": MEANING[w][1]} for w in words]}))
          points:
            - label: river
              x: 1.0
              y: 0.0
            - label: water
              x: 0.8
              y: 0.2
            - label: boat
              x: 0.65
              y: 0.1
            - label: flooded
              x: 0.9
              y: 0.0
            - label: money
              x: 0.15
              y: 1.0
            - label: loan
              x: 0.1
              y: 0.9
            - label: interest
              x: 0.0
              y: 1.0
            - label: rate
              x: 0.0
              y: 0.8
            - label: bank
              x: 0.5
              y: 0.5
      - id: pipeline-meaning
        type: diagram
        shape: flow
        brief:
          understand: The embedding step sits right after splitting, turning each token number into a point of meaning.
          how_it_helps: The chapter 1 pipeline with one new box under tokens, highlighted.
          clearer_than_text: It shows that every later step works on points of meaning, not on text.
        figure:
          kind: flow
          parts:
            - {id: vectors, label: Embeddings, note: points of meaning, row: 2}
          links:
            - {from: tokens, to: vectors, label: look up}
        extends:
          diagram: pipeline-tokens
          adds: "an embedding for each token, picked from a table by its number."
      - id: number-pitfall
        type: pitfall
        misconception: number-is-meaning
      - id: place-loan
        type: fill_blanks
        instructions:
          - Fill the blank with where loan sits on the map of meaning.
        language: text
        source: the toy map of meaning
        context_note: The toy map above, with loan added.
        text: "On the map of meaning, loan sits {{place}}."
        blanks:
          - id: place
            options:
              - text: next to money and interest
                correct: true
                why_right: Loan is used in the same kind of sentences as money and interest, so training puts it beside them.
                output: "In the toy map, loan is at (0.1, 0.9), right beside money at (0.15, 1.0) and interest at (0.0, 1.0)."
                output_from: worked
                output_source: read from the toy map's numbers
              - text: next to loam, which is spelled almost the same
                correct: false
                why_wrong: Positions come from how words are used, not from how they are spelled.
                misconception: looks-alike-means-alike
                output: "Spelling plays no part in the position. Loam is used with soil and gardens, so it would sit far from loan."
                output_from: worked
                output_source: follows from how embeddings are trained (used alike, placed alike)
              - text: next to the token whose number comes right after it
                correct: false
                why_wrong: A token's number is only its row in the table; neighbouring rows are unrelated.
                misconception: number-is-meaning
                output: "The next number is just the next row of the table, usually an unrelated piece of text. Meaning is in the embedding, not the number."
                output_from: worked
                output_source: follows from how an embedding table is looked up
        hints:
          - Is the position about spelling, about the number, or about how the word is used?
      - id: spelling-pitfall
        type: pitfall
        misconception: looks-alike-means-alike
      - id: embedding-key-check
        type: check
        purpose: key
        tests: embedding-idea
        question: In a model's embedding space, which word would you expect to sit closest to "doctor"?
        options:
          - {text: "nurse", correct: true, why_right: "Doctor and nurse appear in the same kind of sentences, so their points sit close."}
          - {text: "doctrine", correct: false, why_wrong: "It shares letters, but it is used in very different sentences."}
          - {text: "whichever token has the next number", correct: false, why_wrong: "Numbers are table rows; they say nothing about meaning."}
      - id: meaning-recap
        type: recap
        text: Each token number picks an embedding, a learned point where words used alike sit close together.
        sums_up: [embedding-idea, meaning-map]

  # ---------------------------------------------------------------- 3
  - id: attention
    title: "Attention: words look at each other"
    minutes: 12
    beat: [mechanism]
    milestone: "I can explain how attention moves a word's meaning toward its context."
    open_question: "One round links words in pairs; how does a model work out harder links?"
    why_it_matters: Bank starts as the same point in both sentences. Attention is the step that gives it the right meaning, and it is the core of every modern LLM.
    must_know:
      - Each token looks at every other token and weighs how relevant each is.
      - It then blends in their meanings, so its point moves with its context.
    must_get_right:
