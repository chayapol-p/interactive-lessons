        question: "In \"She put the glass on the table and it broke\", which word should it attend to most?"
        options:
          - {text: "glass, because glass is what breaks", correct: true, why_right: "Attention weighs relevance: the thing that can break gets the share."}
          - {text: "table, because it is the nearest noun", correct: false, why_wrong: "Nearness does not decide attention; relevance does."}
          - {text: "and, the word right before it", correct: false, why_wrong: "And says nothing about what broke."}
